# nwp-box-backup.conf — live (the LIVE SITES box)
#
# THE DECLARED BACKUP LEGS FOR THIS HOST. Installed to /etc/nwp-box-backup.conf
# by `pl host apply live --kind=backup --execute`; read (never sourced) by
# /usr/local/sbin/nwp-box-backup.sh. See the nwpcode copy of this file for why
# a declaration exists at all (nwp/ops#332).
#
# Values: required | none.  Anything else — including a missing file or a
# missing key — reads as UNDECLARED, which is the stricter direction.

# Site databases. This is the box that holds them: measured 2026-08-10, mysqld
# is active and the 01:30 nightly dumped SIXTEEN site databases into
# /var/backups/nwp-pull/db (the roster is derived from the box, never listed
# here — the engine tree does not name private site instances, ops#326).
# If that ever produces nothing, this line is what turns the silence into an
# exit 1 instead of a `done`.
SITE_DB_LEG=required

# GitLab application backup. GitLab was purged from this clone during the
# 2026-07-31 cutover — `gitlab-backup` is not installed here and must not be.
# Declared rather than inferred so that GitLab reappearing on this box (which
# would mean a second, unmanaged forge) is a loud failure, not a silent extra.
GITLAB_LEG=none
