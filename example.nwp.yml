################################################################################
# Recipes (legacy v2 key; still supported via additionalProperties)
#
# Recipes describe the install profile for a site. The recipe name appears
# in `sites.<name>.recipe`. The pod recipe (podcast) is shown as a
# canonical example; the full annotated catalogue (d, os, avc, avc-dev,
# dm, m, gitlab, pod) lives in `example.nwp.v2.yml`.
recipes:
  pod:
    type: podcast
    description: Podcast hosting site (audio publishing + RSS feed)
    profile: standard
    install_modules: [pathauto, simple_sitemap, podcast_publisher]
settings:
  # `pl backup replicate` — copy each site's newest backup artifact(s) to
  # these ssh targets (verified by remote sha256), so one dead disk is an
  # inconvenience, not a loss. DELIBERATELY no default: an undeclared replica
  # is an unchecked replica, and host names do not belong in tracked files.
  # backup:
  #   replicas:
  #     - user@backup-host-1
  #     - user@backup-host-2
  todo:
    thresholds:
      # A site's newest backup older than this many days is flagged stale by
      # `pl todo` / `pl rag` and picked up by `pl backup sweep`.
      backup_warn_days: 7
      # ops#124: `pl backup prune` deletes LOCAL backup sets older than this
      # (default 30) so deleted user data does not survive the erasure window
      # in local backups. The newest set per site is always kept. Remote DR
      # tiers (restic on ver, LUKS sticks, box nightly) enforce their own
      # retention — see docs/reports/consolidation-arc-2026-07.
      backup_retention_days: 30
      # rag-sync (RAG state -> nwp/ops issues) is the tracker's WRITE half, and
      # a skipped run exits 0 — so cron looks healthy while nothing is filed.
      # `pl todo` ages the last COMPLETED run, not the last log line.
      rag_sync_warn_days: 2
      rag_sync_alert_days: 7
      # An alert path nobody has exercised is not an alert path. `pl notify
      # health` stamps private/.notify-last-ok; this ages that stamp.
      notify_health_warn_days: 7
      # Forge patch cadence (ops#80): the forge holds the trust root, and its
      # apt key once expired silently. `pl server forge status <name>` stamps
      # private/forge/<name>.last-check; this ages that stamp. Never re-probes
      # the box (it OOMs) — cadence is nagged from the recorded timestamp.
      forge_warn_days: 30
      forge_alert_days: 45
    # Item 2 (oversight-honesty) checks. All default to enabled; set false to
    # silence — but note that silencing a check is NOT the same as it passing,
    # which is the whole failure mode these were added to close.
    categories:
      # Surfaces .loop-paused / .rag-sync-paused / disabled loop parts, with the
      # age of the pause. A pause nobody can see is an outage.
      paused_automation: true
      # Ages the last successful rag-sync run.
      rag_sync: true
      # Ages the last proven `pl notify health` canary.
      notify_health: true
    notifications:
      enabled: false
      email:
        enabled: false
        recipient: you@example.com
        smtp_profile: default
      daily_digest: true
      digest_time: 07:00
    schedule:
      cron: 0 7 * * *
  # NWP Console (pl console) — the mesh-only, passkey-only web console.
  # Operator-specific by nature; these placeholder values are replaced in your
  # gitignored nwp.yml (P61: real host names never live in committed code).
  console:
    host: console-host              # ssh alias of the deploy host (AI/dev tier box)
    fqdn: console.example.com       # public DNS name; A record -> tailnet_ip (mesh-only reach)
    tailnet_ip: 100.64.0.2          # the host's WireGuard/Headscale mesh IP (uvicorn binds ONLY this)
    port: 8600
    headscale_url: https://headscale.example.com   # control server URL for device enrolment
################################################################################
# Extension fields
#
# The schema sets `additionalProperties: true` at the document root, so
# operators may add operator-private blocks (e.g. `linode:`,
# `import_defaults:`, `other_coders:`, expanded `recipes:` catalogues)
# without breaking validation. Those blocks belong in your operator
# overlay (`$HOME/nwp-instances/_global/nwp.yml`), not in this public
# template.
#
# Examples of legitimate extension blocks documented in the legacy v2
# template (`example.nwp.v2.yml`) include:
#   - `settings:` — global PHP / email / SEO / verification defaults
#   - `linode:`   — Linode server inventory (operator-specific IPs)
#   - `recipes:`  — full site install profiles catalogue
#                  (drupal, opensocial, avc, dm, moodle, gitlab variants)
#   - `other_coders:` — multi-coder DNS delegation
#   - `import_defaults:` — `pl import` knobs
#
# Those blocks are deliberately omitted from this template to keep the
# v3 example focused on the schema's new mechanisms (roles, features,
# tier). Refer to `example.nwp.v2.yml` for full annotated examples of
# the legacy keys.
################################################################################
