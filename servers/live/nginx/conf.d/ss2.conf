# ss2.nwpcode.org RETIRED 2026-07-21 — the v1 archive is superseded by v3 on
# ss.nwpcode.org (Curated tab = ss2's view; all v1 courses are in v3). Docroot
# /var/www/ss2 preserved + backed up (~/ss2-archive-*, ~/ss2-docroot-*). To
# restore: put back ~/ss2.conf-*.bak and reload.
server {
    listen 80;
    server_name ss2.nwpcode.org;
    # ACME renewal must stay reachable over HTTP without redirect.
    # The 2026-07-31 box split left every vhost here 301-ing the
    # challenge path, so certbot (webroot authenticator, every
    # lineage) could never renew. ss2 was already failing daily.
    # Root is the webroot certbot is configured with for this
    # lineage (ss2.nwpcode.org), read from its renewal conf — not guessed.
    location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/ss2; allow all; }
    location / { return 301 https://ss.nwpcode.org$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name ss2.nwpcode.org;
    ssl_certificate /etc/letsencrypt/live/ss2.nwpcode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ss2.nwpcode.org/privkey.pem;
    return 301 https://ss.nwpcode.org$request_uri;
}
