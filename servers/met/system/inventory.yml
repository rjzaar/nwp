# Host-state inventory — ci-host / build-host.
#
# Named by ROLE, never by hostname (ADR-0020 + docs/reference/role-vocabulary.md).
# `ssh_role` below is resolved through `pl host`, which reads the operator's
# private instance manifest, so no machine name appears in this repo.
#
# This host carries the CONSUMER half of the DR chain. Before 2026-07-26 the
# entire chain was one root cron one-liner here, generated by a
# `dr-pull-setup.sh` that exists in no repository. Its restic retention
# (--keep-monthly 12 of raw prod pulls) was an inline flag nobody could grep,
# while the GDPR retention work is about exactly that number. If this box died,
# the DR design died with it.
#
# Note: the repo ships scripts/systemd/nwp-server-backup@.service/.timer — that
# is NOT what runs. The cron below is what runs. Capturing it is step one of
# reconciling the two; converting the cron to the versioned timer is a separate,
# gated change (it touches the only off-box copy of prod data).
#
# ⚠ ci-host resolves through `pl host ci-host` to a LAN alias. We are routinely
# off-LAN, so `pl server-state diff met` will correctly report UNREACHABLE
# rather than clean. That is the honest answer, and it is also known N: the
# demo-reset installer hardcodes the same unreachable alias.

host: met
ssh_role: ci-host

artifacts:
  - id: cron-nwp-dr-pull
    kind: file
    remote: /etc/cron.d/nwp-dr-pull
    why: "THE DR CHAIN. rsync prod -> /srv/nwp-dr/staging, restic backup, then forget --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --prune, then check. The retention numbers here are the ones the erasure/retention work must agree with; they belong in YAML, not in a cron line."

  - id: cron-nwp-stick-backup
    kind: file
    remote: /etc/cron.d/nwp-stick-backup
    why: "The offline leg — pushes to the LUKS sticks N1/N2/N3. The only copy of the fleet that is not online; unversioned until now."

  - id: cron-nwp-met-user-dr
    kind: cmd
    remote: "crontab -l | grep -A1 'NWP met user DR pull'"
    why: "The USER-LEVEL DR leg (ops#330): scripts/met-dr-pull.sh at 03:35 pulls the dev laptop's curated export (rrsync-ro key, push-fallback while the laptop's sshd awaits the operator) AND the LIVE box's nightly /var/backups/nwp-pull (proven to have NO off-box consumer before this) into ~/nwp-dr/repo, with post-run snapshot freshness+size verification. User crontab because rob has no passwordless sudo here; folding it into /srv/nwp-dr (so the 03:15 stick pull carries it) is a flagged operator option."
    repo_counterpart: servers/met/system/cron-nwp-met-user-dr

  - id: systemd-cpu-freq-cap.service
    kind: cmd
    remote: "systemctl cat cpu-freq-cap.service"
    why: "The fix for this box's recurring kernel panic / overload (task #10, marked complete). The whole remedy was one unversioned unit file: a rebuild would silently reintroduce the crash that took the CI host down."

  - id: nwp-daily-audit
    kind: file
    remote: ~/bin/nwp-daily-audit
    why: "The project's own lesson-script. The on-host copy (md5 53e6068…, 257 lines) and the repo's scripts/nwp-daily-audit.sh (md5 cc8cc84…, 331 lines) share no header — they are different programs with the same job. Capturing the running one makes the divergence reviewable instead of theoretical."
    repo_counterpart: scripts/nwp-daily-audit.sh
    counterpart_divergence: >-
      DECLARED, NOT ACCEPTED. These are two different programs. The on-host copy
      is authoritative for BEHAVIOUR (it is what actually runs nightly); the repo
      copy is authoritative for PARAMETERISATION (it is the one that takes a
      SITES array and an NWP_ROOT). Reconciling them means making the ci-host run
      $NWP_ROOT/scripts/nwp-daily-audit.sh from a checkout on a schedule the repo
      owns — which needs a remote-schedule verb (`pl host schedule`, item 6) that
      does not exist yet. Until then this line is the record that we know, so the
      divergence cannot quietly become invisible again. Tracked as the tail of
      the nwp-daily-audit lesson; do NOT delete this key to make the check green.
