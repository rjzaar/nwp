[[rules.allowlists]]
description = "Standard config filenames ending in .local (settings.local.php, .env.local, jail.local, config.local.yaml, …) — filename conventions, not internal hostnames. regexTarget=line matches the surrounding line so any of these tokens in context suppresses the match."
regexTarget = "line"
regexes = [
  '''settings\.local\.php''',
  '''settings\.local\.overrides\.php''',
  '''\.env\.local''',
  '''jail\.local''',
  '''config\.local\.(yaml|yml|json)''',
  '''social\.local''',
  '''settings\.local\.json''',
  '''\.nwp\.local\.yml''',
  '''\.nwp-developer\.local\.yml''',
  '''\.behat\.local\.yml''',
  '''composer\.local\.json''',
  '''package\.local\.json''',
  '''docker-compose\.local\.yml''',
  '''behat\.local\.yml''',
  # NWP's own gitignore/gitleaksignore files necessarily mention these patterns.
  '''^[#\s]*\*\*/.*\.local\.''',
]
paths = [
  '''^\.gitignore$''',
  '''^\.gitleaks\.toml$''',
  '''^\.gitleaksignore$''',
  '''^docs/decisions/0021-public-only-repo-scope\.md$''',
]

[[rules]]
id = "internal-bare-hostname"
description = "Internal bare hostname leak (operator's role-bound names)"
# Per P61 §4.1 OQ-1 (narrow ruleset). When a new role-bound host name is added
# to instance-manifest.yml, append it here.
# Note: `met` is NOT included as a bare word because it collides with English
# usage ("prerequisites met"); `metabox` covers the full form.
regex = '''\b(mini|metabox|mons|carlo|mmt)\b'''
tags = ["leak", "hostname"]
path = '''(?i).*\.(md|markdown|rst|txt|yml|yaml|json|toml|sh|bash|py|php|js|ts|html)$'''

