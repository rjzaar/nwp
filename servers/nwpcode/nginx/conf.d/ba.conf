server {
    listen 80;
    server_name ba.nwpcode.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ba.nwpcode.org;

    ssl_certificate /etc/letsencrypt/live/ba.nwpcode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ba.nwpcode.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ba/web;
    index index.php index.html;

    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include /opt/gitlab/embedded/conf/fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location ~* \.(txt|log)$ {
        deny all;
    }

    location ~ ^/sites/.*/files/styles/ {
        try_files $uri /index.php?$query_string;
    }
}
