server {
    listen 80;
    server_name rgs.nwpcode.org;
    # ACME renewal must stay reachable over HTTP without redirect.
    # The 2026-07-31 box split left every vhost here 301-ing the
    # challenge path, so certbot (webroot authenticator, every
    # lineage) could never renew. ss2 was already failing daily.
    # Root is the webroot certbot is configured with for this
    # lineage (rgs.nwpcode.org), read from its renewal conf — not guessed.
    location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/rgs; allow all; }
    location / { return 301 https://$server_name$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name rgs.nwpcode.org;
    ssl_certificate /etc/letsencrypt/live/rgs.nwpcode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rgs.nwpcode.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/rgs;
    index index.php index.html;
    client_max_body_size 256M;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include /etc/nginx/fastcgi_params;
    }
    location /dataroot/ { internal; alias /var/www/rgs_moodledata/; }
    location ~ /\.ht { deny all; }
}
