# S11: Specialized Installs Scenario
# Part of P51: AI-Powered Deep Verification
#
# Verifies specialized installation commands.
#
# 2026-08-10 (ops#326 Phase 1 tranche 3): the four-command integration family
# this scenario also covered was RETIRED. It was unfinished scaffolding — the
# Drupal modules and the Moodle auth plugin it claimed to install were never
# written ("will be enabled once created") — it was superseded by the proven
# OIDC path (`pl link verify`, scripts/f26/*, lib/moodle-promote.sh), and it was
# named after a private site instance. `pl pipeline` replaces the other retired
# verb and is covered here in its place.

scenario:
  id: S11
  name: "Specialized Installs"
  description: "Verify specialized installation commands exist"
  depends_on:
    - S1  # Needs foundation
  estimated_duration: 3
  is_gate: false

  commands_tested:
    - podcast.sh
    - pipeline.sh

  steps:
    - name: Check podcast command exists
      cmd: test -f scripts/commands/podcast.sh && echo "podcast.sh exists"
      expect_exit: 0
      expect_contains: "exists"

    - name: Check pipeline command exists
      cmd: test -f scripts/commands/pipeline.sh && echo "pipeline.sh exists"
      expect_exit: 0
      expect_contains: "exists"

    - name: Run pl podcast help
      cmd: ./pl podcast --help 2>&1 | head -10 || echo "podcast command checked"
      expect_exit: 0
      timeout: 30

    - name: Run pl pipeline help
      cmd: ./pl pipeline --help
      expect_exit: 0
      expect_contains: "pipeline"
      timeout: 30

    - name: pl pipeline refuses an unowned flow rather than exiting 0 blind
      cmd: ./pl pipeline --find=__nwp_no_such_flow__ --dry
      expect_exit: 1
      timeout: 30

    - name: Verify scripts pass syntax check
      cmd: |
        for script in podcast pipeline; do
          if [[ -f scripts/commands/${script}.sh ]]; then
            bash -n scripts/commands/${script}.sh 2>&1 || echo "Syntax issue in ${script}.sh"
          fi
        done
        echo "Syntax check complete"
      expect_exit: 0
      expect_contains: "complete"
      timeout: 30
