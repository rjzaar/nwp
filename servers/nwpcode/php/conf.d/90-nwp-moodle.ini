; 90-nwp-moodle.ini — DECLARED php state for the SAPIs Moodle actually uses.
;
; ⚠ NOT YET APPLIED. This file is the declared intent; installing it on the box
; is an operator action (see docs/reports/consolidation-arc-2026-07/
; rollback-registry.md CP22). `pl server-state php-check nwpcode` currently
; exits 1 against the live host, which is the correct and intended state until
; the operator applies it.
;
; WHY THIS FILE EXISTS
;
; On 2026-07-26 a Moodle course edit blew the max_input_vars ceiling. The
; remedy — max_input_vars = 5000 — was applied by hand to PHP 8.3.
;
; Moodle does not run on 8.3. It runs on 8.2:
;
;   /etc/nginx/conf.d/ss.conf  ->  fastcgi_pass unix:/var/run/php/php8.2-fpm.sock
;   Moodle cron                ->  /usr/bin/php8.2
;
; Measured on the box 2026-07-26 (`pl server-state capture nwpcode`, artifact
; php-map, now versioned at ../../system/php-map):
;
;   8.2/fpm max_input_vars=1000   <- serves Moodle. PHP default.
;   8.2/cli max_input_vars=1000   <- runs Moodle cron + CLI upgrades. PHP default.
;   8.3/fpm max_input_vars=5000   <- the fix, on a SAPI Moodle never touches
;   8.3/cli max_input_vars=5000   <- likewise
;
; So the outage remedy was never in force, the setting was in nobody's version
; control, and any grep for "max_input_vars" found 5000 and concluded it was
; handled. The next upgrade run that forgets `-d max_input_vars=5000` repeats
; the outage AND leaves the site in maintenance mode.
;
; DEPLOY TO BOTH 8.2 SAPIs — fpm alone is not enough, because the CLI path is
; what runs admin/cli/upgrade.php:
;   /etc/php/8.2/fpm/conf.d/90-nwp-moodle.ini
;   /etc/php/8.2/cli/conf.d/90-nwp-moodle.ini
; then: systemctl reload php8.2-fpm
;
; The floor is asserted per-SAPI in ../../system/inventory.yml (php_floors), so
; `pl server-state php-check nwpcode` fails if either SAPI drops below it —
; including after a PHP minor-version upgrade moves the conf.d directory.

max_input_vars = 5000
