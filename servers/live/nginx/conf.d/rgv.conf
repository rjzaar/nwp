# rgv.nwpcode.org — nwptoolkit (vid) reverse proxy, FULLY GATED.
# auth_basic at server level covers EVERY location (/, /api/*, /static/*):
# an unauthenticated request to ANY path (incl. /api/search) returns 401.
# The login gate is the copyright mitigation while rg is derivative-pending.
server {
    listen 80;
    listen [::]:80;
    server_name rgv.nwpcode.org;
    # ACME renewal must stay reachable over HTTP without auth/redirect.
    location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/html; allow all; }
    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rgv.nwpcode.org;

    ssl_certificate     /etc/letsencrypt/live/rgv.nwpcode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rgv.nwpcode.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # --- FULL-SITE basic-auth gate (applies to every location below) --------
    auth_basic           "nwptoolkit (vid) — login required";
    auth_basic_user_file /etc/nginx/htpasswd-rgv;

    # ACME challenge exempt from auth so renewals succeed behind the gate.
    location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/html; allow all; }

    # Reverse proxy to the shared nwptoolkit instance; Host preserved so the
    # Host->set middleware scopes rgv.nwpcode.org -> set rg.
    location / {
        proxy_pass http://100.64.0.3:8071;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_redirect     off;
    }
}
