[[rules]]
id = "operator-personal-email"
description = "Operator's personal email address leak (PII). Use a role/contact address (e.g. security@<domain>, legal@<domain>) in public artefacts."
# Narrowly targets the operator's personal local-part so we don't false-positive
# on contributors' or example emails. Extend the alternation if the operator
# adds another personal address.
regex = '''\b(rjzaar)@[a-z0-9.-]+\.[a-z]{2,}\b'''
tags = ["leak", "email", "pii"]

# DELIBERATELY NO PATH ALLOWLIST — not even SHARED-EXEMPTIONS. This is PII, and
# the operator-bound-file argument ("this file's purpose is to name operator
# infrastructure") does not extend to a personal email address. NOTICE and
# docs/CC0_DEDICATION.md were swapped to role addresses (legal@) as part of
# ops#98. Historical audit reports that still carry it are pinned individually
# in .gitleaksignore with a scrub-backlog comment.

[[rules]]
id = "live-domain-apex"
description = "Bare APEX operator domain leak (nwpcode.org / mayostudios.org). live-internal-domain only catches sub.domain forms; this also catches the bare apex."
regex = '''\b(nwpcode|mayostudios)\.org\b'''
tags = ["leak", "domain"]

[[rules.allowlists]]
description = "Operator-bound paths: files whose PURPOSE is to name the operator's own machines, homes, hosts and org. Credential rules still apply to all of them."
# --- SHARED-EXEMPTIONS BEGIN ---
paths = [
  # Operator's machine map (Distributed Actor Glossary) — by design.
  '''^CLAUDE\.md$''',
  # Test verification ledger — references operator's tier hosts intentionally.
  '''^\.verification\.yml$''',
  # Internal ops tooling that legitimately names operator infra (same class as
  # CLAUDE.md): the GitLab webhook receiver and the Saint School admin-reset helper.
  '''^scripts/agent-loop/gitlab-webhook-receiver\.py$''',
  '''^scripts/ss-admin-reset\.sh$''',
  # Archive directory holds historical infrastructure documents — defeats the purpose to scrub.
  '''^docs/archive/.*''',
  # Coder onboarding docs deliberately name operator infrastructure — that's their
  # teaching purpose. Same shape as CLAUDE.md.
  '''^docs/onboarding/.*''',
  # Servers tree is operator-specific (F33 §4.1); scheduled to move to nwp-instances/_servers.
  '''^servers/(mini|mayo1|nwpcode)/.*''',
  # Role vocabulary doc must cite the banned tokens (it's the rule definition).
  '''^docs/reference/role-vocabulary\.md$''',
  # The proposals that define the rule must cite the tokens they ban.
  '''^docs/proposals/F34-role-label-proposal-rewrite\.md$''',
  '''^docs/proposals/P61-leakage-hygiene-ci\.md$''',
  # CHANGELOG mentions the pre-restart archive remote and historical org names.
  '''^CHANGELOG\.md$''',
  # Migration script maps legacy hostnames to role labels — has to name them.
  '''^lib/migrations/global/migrate_002_to_003\.sh$''',
  # F15 documents the conventional gitlab system service-account home
  # (/home/gitlab/.ssh) — a well-known service account, not the operator's home.
  '''^docs/proposals/F15-ssh-user-management\.md$''',
  # Audit-authors script encodes the operator's name regex on purpose.
  '''^bin/audit-authors\.sh$''',
  # Example and template files demonstrate placeholder values that look
  # hostname-shaped but are explicitly mysite.example.com / yourname.local style.
  '''^example\.nwp\.yml$''',
  '''^example\.nwp\.v2\.yml$''',
  '''^\.nwp-developer\.example\.yml$''',
  '''^templates/.*''',
  # The pl CLI's help-text examples reference mysite.example.com etc.
  '''^pl$''',
  # Test fixtures intentionally include leaky-looking content for the test.
  '''^tests/.*''',
  # The gitleaksignore file itself names the patterns it ignores.
  '''^\.gitleaksignore$''',
  # Historical reports document the operator's original infrastructure
  # — same principle as docs/archive/ being exempt.
  '''^docs/reports/.*''',
  # The agent-loop crontab.entry is operator-specific documentation; cron has no
  # $HOME so the path has to be absolute.
  '''^scripts/agent-loop/crontab\.entry$''',
  # Verifier-host (ver/mons) setup kit — operator-bound files that must name the
  # host they configure.
  '''^scripts/mons-setup\.sh$''',
  '''^docs/guides/mons-verification\.stanza\.yml$''',
  '''^docs/guides/mons-operational-readiness\.md$''',
  # nwd nightly demo-reset runbook (ops#133): an operator-bound server-access
  # runbook whose whole content is "which key, on which host, may run what".
  '''^docs/guides/demo-nightly-on-met\.md$''',
]
# --- SHARED-EXEMPTIONS END ---

[[rules.allowlists]]
description = "Functional files that must carry the real operator domain (deploy targets, sanitizer targets, schema example-defaults, CI, fallback defaults) + real-contact files. Candidates for role-label resolution (F34), NOT prose to genericise — see SCRUB-INVENTORY-2026-07-16.md. Prose docs are genericised to example.com instead of being allowlisted."
paths = [
  '''^\.gitlab-ci\.yml$''',
  '''^lib/sanitizers/mayo\.sh$''',
  '''^lib/schema/nwp_yml_v3\.json$''',
  '''^lib/install-drupal\.sh$''',
  '''^lib/rollback-remote\.sh$''',
  '''^scripts/.*''',
  # Real-contact contexts: these carry a reachable ROLE address (legal@), which
  # is the whole point of the ops#98 swap — the apex domain in them is intended.
  '''^NOTICE$''',
  '''^docs/CC0_DEDICATION\.md$''',
  '''^docs/SECURITY\.md$''',
]

[[rules.allowlists]]
description = "Fleet smoke-test checklist — a deliberate index of live surfaces (ops#131)."
paths = ['''^docs/guides/test-links\.md$''']

[[rules.allowlists]]
description = "Placeholder tokens of the form <gitlab-host> etc."
regexes = [
  '''<gitlab-host>''',
  '''<example-prod-domain>''',
  '''<mayo-domain>''',
  '''<coder-domain>''',
  '''<headscale-host>''',
]

# Decision 14 (2026-07-09): public GitLab project URLs on the git host
# (git.nwpcode.org/-/issues|merge_requests|blob|tree/...) are public issue/MR/
# source links, not site-subdomain leaks. Scoped narrowly to the git host + the
# /-/.../ path form, matched against the whole line.
[[rules.allowlists]]
description = "Public git.nwpcode.org GitLab issue/MR/blob/tree URLs (public project links, not subdomain leaks)."
regexTarget = "line"
regexes = [
  '''git\.nwpcode\.org/[\w./-]+/-/(issues|merge_requests|blob|tree)/''',
]

