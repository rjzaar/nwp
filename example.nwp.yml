# NWP per-operator configuration — v3 template
#
# Copy this file to your operator instance directory (per F33):
#   $HOME/nwp-instances/_global/nwp.yml
#
# This template is **schema-v3** (per ADR-0020 + F32 Phase A). The schema
# is enforced by `lib/schema/nwp_yml_v3.json` and validated on every
# `pl tier validate-config` run plus every CI build.
#
# Full prose reference:
#   docs/reference/nwp.yml.md
# Role-label vocabulary (the canonical role names used below):
#   docs/reference/role-vocabulary.md
# Migrating from a v2 nwp.yml? See:
#   lib/migrations/global/migrate_002_to_003.sh
#   (run `pl tier migrate-config` for the interactive path.)
#
# The legacy v2 template is preserved at `example.nwp.v2.yml` for
# operators with v2 configs who want to compare field-by-field.
#
# Style rules (enforced by the leakage gate, `.gitleaks.toml`):
#   - Use role labels, not hostnames (`authoring` not `mylaptop`).
#   - Use `$HOME/...` for paths, never `/home/<user>/...`.
#   - Use placeholders like `<gitlab-host>`, `<example-prod-domain>`,
#     `<sponsor-organisation>` for operator-specific values.
#
################################################################################
# CORE — every v3 nwp.yml MUST have this `nwp:` block
################################################################################

nwp:
  # Schema version. Integer 3 for this template. (OQ-1 default: integer.)
  version: 3
  # Tier preset — one of 1, 2, 3, 4. Tier sets sensible defaults for the
  # `features:` block; per-feature settings below override the preset.
  #
  #   Tier 1  Solo laptop. Manual deploy. No CI / AI / voice. (default)
  #   Tier 2  Tier 1 + ci-host for fresh-clone integration tests.
  #   Tier 3  Tier 2 + ai-host (Claude bridge, local LLM, voice agent, RAG).
  #   Tier 4  Tier 3 + verifier (offline signed-deploy box, prod-trust).
  #
  # See `docs/reference/nwp.yml.md` §2-4 for example configs of each tier.
  tier: 1
  # Short label shown in `pl status` headers. Useful for distinguishing
  # multiple NWP instances on the same machine (e.g. work vs personal).
  operator_alias: solo-blog
################################################################################
# === TIER 1 — solo laptop (default; uncommented) ===============================
#
# Single machine acting as `authoring`. No CI, no AI, no remote anything.
# Deploys are manual (operator runs `pl stg2live` from the workstation).
################################################################################
hosts:
  # Map of host-name → host config. The host *name* is the operator's
  # internal label; conventionally use the role itself (`authoring`,
  # `ci-host-1`) so public documentation reads naturally without any
  # hostname leakage. Never put bare operator hostnames here.
  dev:
    # `local: true` means "this host IS the current machine."
    local: true
    # Roles drawn from the enum in `lib/schema/nwp_yml_v3.json`. See
    # `docs/reference/role-vocabulary.md` for the canonical definitions.
    roles: [authoring]
features:
  # Each feature has `enabled: <bool>` at minimum. Enabled features pick
  # an adapter via `backend:` (see `lib/adapters/<feature>/<backend>/`
  # for what's available).
  ci:
    enabled: false
    # backend: gitlab-runner | gh-actions | docker-local
  ai:
    enabled: false
    # backend: claude-api | ollama-local
  deploy_mode:
    enabled: true
    # `manual` = operator runs deploy commands by hand from `authoring`.
    # Tier 2+ usually uses `ci-direct`; Tier 4 uses `signed-deploy`.
    backend: manual
  secrets:
    enabled: true
    # `sops-age` is the recommended default; `plaintext-yaml` is for the
    # bootstrap phase only.
    backend: sops-age
  backup:
    enabled: true
    # `b2` = Backblaze B2 (cheap object storage). `restic-local` for
    # local-only backups; `restic-b2` for restic-managed B2 buckets.
    backend: b2
################################################################################
# SITES — per-site cross-cutting defaults
#
# The full per-site config lives at `instance-overlay/<site>/nwp.yml`
# (per F33). This block carries only cross-cutting defaults so the
# global view stays terse. Each site key is the operator's internal site
# slug.
################################################################################
sites:
  # An example Drupal site using the `avc` recipe.
  example-drupal:
    recipe: avc # see recipes/ (avc, d, dm, os, m, etc.)
    php: "8.2" # override stack default
    database: mariadb
    live_domain: <example-prod-domain> # placeholder — never a real domain here
    # Canonicality phase (nwp/ops#33) — which host owns the site's CONTENT.
    # Enforced by the deploy commands, not just documented:
    #   dev  — dev DB is the source of truth; dev→live pushes allowed
    #          (dev overwrites live; anything authored on live is disposable).
    #   live — content changes on live ONLY; dev gets a sanitized live→dev
    #          copy; dev→live CONTENT pushes are refused (code/config-only
    #          deploys still flow via `pl stg2live --code-only`).
    #   prod — prod is the source; live/dev are downstream sanitized copies;
    #          code work is branch-only with a protected CI-gated main
    #          (ADR-0024).
    # Default when absent: dev (today's behavior). Change phases with an
    # explicit operator action — `pl canonical set <site> <phase>` — which
    # records canonical_set_by/canonical_set_at here and appends to the
    # private/canonical/<site>.log ledger.
    canonical: dev
    # Maturity class (P67/ops#48) — who may deploy the site's CODE:
    #   incubating  — direct `pl stg2live` allowed (A14 test tier). Default.
    #   stabilizing — deploys only from a clean main merged to origin/main.
    #   production  — direct deploys refused; signed-bundle path only.
    # Set with `pl maturity set <site> <class>` (ledgered; downgrades need
    # typed confirmation). Invalid pairs with canonical are refused.
    # maturity: incubating
    #
    # Site CLASS (ADR-0036/ops#153) — the THIRD axis. canonical says where
    # content is true, maturity says how carefully code moves; class says what
    # the site IS, and therefore which DATA invariants bind it:
    #   member-paired      real members; identity+consent from a paired provider
    #                      → Art.9 gate REQUIRED, delegated to that provider
    #   member-standalone  real members; NO provider, no consent source
    #                      → Art.9 satisfied locally, or exempted BY EVIDENCE
    #   demo               synthetic/seeded only; resettable; never real members
    #   service            no non-operator accounts at all
    # NOTE the default differs from maturity ON PURPOSE. Absent maturity means
    # `incubating` (permissive). Absent class means UNDECLARED and FAILS CLOSED
    # — "assume no members, assume no special-category data" is an assertion no
    # machine may make on no evidence.
    # This key is only a CROSS-CHECK. The authoritative, reviewable declaration
    # is the tracked classes/<site>.class.yml — because nwp.yml is never
    # committed, and a claim that switches off the Art.9 consent gate has to be
    # visible in a merge request. A disagreement between the two is
    # `contradictory:` and refuses. Declare with `pl class set <site> <class>`.
    # class: member-paired
    #
    # Branch-twin lineage (P67 §5b/§5c) — written by `pl branch`, shown
    # nested in `pl status`. A twin has NO live: block (deploy-incapable).
    # branch_of: <parent-site>
    # branch: feat/some-idea
    # content_source: fresh | parent | live | prod | demo
    # content_as_of: 2026-07-08T00:00:00Z
    options:
      environment_indicator: y
      config_split: y
      security_modules: y
      backup: y
      ssl: y
  # An example Moodle LMS site paired with the Drupal AVC above for SSO.
  example-moodle:
    recipe: m
    php: "8.1" # Moodle 4.x requires PHP 8.1
    database: mariadb
    sitename: "Example LMS"
    live_domain: lms.<example-prod-domain>
    avc_integration:
      avc_site: example-drupal # link by site key, not domain
      default_role: student
    # Paired-site link (ADR-0031). `paired_with` names the PROVIDER SITE KEY as a
    # BARE SCALAR — never a map, never a URL. The provider's endpoint URL belongs
    # in the pair contract's endpoints.<tier>.issuer (and, for Moodle consumers,
    # oauth2.provider_url); a map here cannot name a site, so pair_guard treats it
    # as CANNOT VERIFY and REFUSES the promotion rather than reading it as
    # "unpaired" (which is how the ssc↔nwc UID-lock guard sat inert until
    # 2026-07-27). See pairs/README.md §"Where a pair is declared".
    paired_with: example-drupal
    project:
      type: moodle # routes the Moodle promotion substrate
    # ── Moodle promotion substrate (ADR-0031 D8 / ops D) ──────────────────────
    # Per-tier values the Moodle settings-writer (lib/moodle-promote.sh, via
    # `pl moodle-promote`) uses to rewrite config.php when this site is promoted
    # to a NON-canonical tier. Only dev/stg/test are written — a live/prod Moodle
    # root is REFUSED (fail-closed). NO passwords here: $CFG->dbpass is resolved
    # at write time from get_data_secret (moodle.<site>.<tier>.db_password), or
    # the well-known ddev default when dbpass_ddev_default: true.
    moodle:
      tiers:
        dev:
          wwwroot: "https://example-moodle-dev.ddev.site"
          dataroot: "/var/www/example-moodle/dev/moodledata"
          dbtype: mariadb
          dbhost: db
          dbname: db
          dbuser: db
          prefix: "mdl_"
          dbpass_ddev_default: true # ddev dev DB pass is the non-secret 'db'
        stg:
          wwwroot: "https://example-moodle-stg.ddev.site"
          dataroot: "/var/www/example-moodle/stg/moodledata"
          dbtype: mariadb
          dbhost: db
          dbname: db
          dbuser: db
          prefix: "mdl_"
          dbpass_ddev_default: true
      # OAuth consumer wiring (F26; OFF-BY-DEFAULT). The issuer URL per tier comes
      # from the PAIR CONTRACT endpoints.<tier>.issuer, NOT here — this only names
      # the non-secret client id + where the client SECRET is looked up.
      oauth:
        client_id: ss_moodle
        client_secret_source: "moodle.example-moodle.oauth.client_secret" # get_data_secret path
        enabled: false # operator flips true after provisioning the secret
        # ---------------------------------------------------------------------------
        # PAIRED SITES (ADR-0031 / ops#75) — nwc↔ssc (real) and nwd↔ssd (demo twins)
        #
        # NWP runs paired sites across two stacks coupled by OAuth2/OIDC SSO,
        # copyright-policy sync and a feedback bridge:
        #     nwc (Drupal/Open Social, PROVIDER) ↔ ssc (Moodle, real students, CONSUMER)
        #     nwd (Drupal demo,        PROVIDER) ↔ ssd (Moodle demo,           CONSUMER)
        #
        # SINCE 2026-07-27 the committed pair contract is the SOURCE OF TRUTH for
        # membership: pairs/<consumer>.pair-contract.yml's `provider:`/`consumer:`
        # keys activate pair_guard on their own. The `paired_with:` keys below are
        # still read and must AGREE with it — they are no longer the only input,
        # because nwp.yml is gitignored and a guard nobody can see is a guard
        # nobody can check. (`pl pair check ssc live` answered ALLOW for months on
        # exactly that.)
        #
        # The CONSUMER carries `paired_with: <provider-site-key>` — a bare scalar.
        # pair_guard refuses a promotion that breaks provider-first ordering, the
        # D6 UID-lock/--code-only rule, or a red pair.
        # Off-unless-configured: a site with no pair anywhere is untouched. But a
        # declaration that exists and cannot be READ (map/URL/bad YAML/two sources
        # disagreeing) is CANNOT VERIFY, and CANNOT VERIFY refuses.
        #
        # The versioned CONTRACT (contract_version, per-surface minimum versions,
        # per-tier issuer URLs, smoke URLs) lives in a separate file per pair at
        # pairs/<consumer>.pair-contract.yml — copy pair-contract.example.yml and fill
        # it in. lib/pair.sh fails CLOSED if a site is declared paired here but its
        # contract is missing/invalid. Inspect with `pl pair status <consumer>`.
        #
        # Key-rotation gate (ops#82/ops#152): the contract's
        # oidc.key_rotation.consumer_core_roots declares where the consumer's
        # Moodle CORE tree lives (scanned in full, ~16.5k files), and
        # oidc.key_rotation.verification_exempt_paths carries the reviewed
        # waivers (shell globs; e.g. the LTI 1.3 platform-key paths). These
        # live in the PAIR CONTRACT, never in nwp.yml. `pl contracts
        # key-rotation` fails CLOSED on an undeclared/absent/empty core tree.
        #
        # ⚠ D6 STANDING RULE: while ssc users hold UID-locks against nwc's live tier,
        #   NO full-DB `pl stg2live nwc` — use --code-only (or flip nwc to
        #   canonical: live). pair_guard enforces this once the contract is authored.
        #
        # ⚠ The OAuth/OIDC WIRING is F26-gated and NOT implemented in Phase C.
        #
        # Copy these into nwp.yml (never commit nwp.yml) once the sites are registered:
        #
        #   nwc:                        # PROVIDER (Drupal/Open Social)
        #     project: { type: drupal }
        #     canonical: dev            # community content source-of-truth (today)
        #     # maturity: incubating
        #   ssc:                        # CONSUMER (Moodle, real students)
        #     project: { type: moodle } # routes the sanitize dispatch (ops#76) + the
        #                               # Moodle promotion substrate (ops D); add a
        #                               # `moodle:` block (see example-moodle) for tiers
        #     paired_with: nwc
        #     canonical: live           # real students → user state canonical (D6)
        #     # maturity: <operator-assigned>
        #   nwd:                        # PROVIDER demo twin
        #     project: { type: drupal }
        #     canonical: dev
        #   ssd:                        # CONSUMER demo twin
        #     project: { type: moodle, demo: true }
        #     paired_with: nwd
        #     canonical: dev            # demo — throwaway user state
        # ---------------------------------------------------------------------------
################################################################################
