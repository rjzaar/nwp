# pray.rosaryforge.org — static site (Blogger export + local audio)
server {
    listen 80;
    listen [::]:80;
    server_name pray.rosaryforge.org;

    # Allow ACME http-01 renewals over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/rosaryforge;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pray.rosaryforge.org;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pray.rosaryforge.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pray.rosaryforge.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/rosaryforge;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.ht {
        deny all;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
}
