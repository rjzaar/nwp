server {
    listen 80;
    server_name ssc.nwpcode.org;
    # ACME renewal must stay reachable over HTTP without redirect.
    # The 2026-07-31 box split left every vhost here 301-ing the
    # challenge path, so certbot (webroot authenticator, every
    # lineage) could never renew. ss2 was already failing daily.
    # Root is the webroot certbot is configured with for this
    # lineage (ssc.nwpcode.org), read from its renewal conf — not guessed.
    location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/ssc; allow all; }
    location / { return 301 https://ss.nwpcode.org$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name ssc.nwpcode.org;
    ssl_certificate /etc/letsencrypt/live/ssc.nwpcode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssc.nwpcode.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://ss.nwpcode.org$request_uri;
}
