; 90-nwp-moodle.ini — DECLARED php state for the SAPIs Moodle actually uses.
;
; OWNED BY A VERB. Install, re-install and verify this file with:
;
;   pl host apply live --kind=php              # dry-run: the exact diff, per SAPI
;   pl host apply live --kind=php --execute    # typed confirm, backup, reload, RE-MEASURE
;   pl server-state php-check live             # the independent assertion
;
; Do NOT scp it. On 2026-08-01 the identical file reached this box by
; `scp` + `sudo cp`, which is the pl-first violation CLAUDE.md forbids: it took
; no backup, recorded no sha256, never re-measured the SAPI afterwards, and left
; no rollback row. The verb does all four. (lib/php-floor.sh)
;
; WHY THIS FILE EXISTS
;
; On 2026-07-26 a Moodle course edit blew the max_input_vars ceiling on the
; nwpcode box. The remedy — max_input_vars = 5000 — was applied by hand to PHP
; 8.3. Moodle does not run on 8.3. It runs on 8.2:
;
;   /etc/nginx/conf.d/ss.conf   ->  fastcgi_pass unix:/var/run/php/php8.2-fpm.sock
;   /etc/nginx/conf.d/ssd.conf  ->  fastcgi_pass unix:/var/run/php/php8.2-fpm.sock
;   ssc + ssd Moodle cron       ->  /usr/bin/php8.2
;
; This box is a 2026-07-31 clone of that one and inherited the identical fault.
; Measured here 2026-08-01 (`pl server-state capture live`, artifact php-map,
; versioned at ../../system/php-map):
;
;   8.2/fpm max_input_vars=1000   <- serves ssc + ssd Moodle. PHP default.
;   8.2/cli max_input_vars=1000   <- runs Moodle cron + CLI upgrades. PHP default.
;   8.3/fpm max_input_vars=5000   <- the 2026-07-26 fix, on a SAPI Moodle never touches
;   8.3/cli max_input_vars=5000   <- likewise
;
; So the outage remedy was never in force, and any grep for "max_input_vars"
; found 5000 and concluded it was handled. The next upgrade run that forgets
; `-d max_input_vars=5000` repeats the outage AND leaves the site in
; maintenance mode.
;
; INSTALLED TO BOTH 8.2 SAPIs — fpm alone is not enough, because the CLI path is
; what runs admin/cli/upgrade.php:
;   /etc/php/8.2/fpm/conf.d/90-nwp-moodle.ini   (then: systemctl reload php8.2-fpm)
;   /etc/php/8.2/cli/conf.d/90-nwp-moodle.ini   (no reload — each run re-reads it)
;
; The `90-` prefix is load-bearing: PHP scans conf.d alphabetically, so this file
; must sort after the packaged extension inis for its value to win.
;
; ⚠ A PHP MINOR-VERSION UPGRADE BREAKS THIS SILENTLY. The path above is version-
; pinned; when the box moves to 8.4 the file stays in /etc/php/8.2/ and stops
; being read. That is why the floor is asserted per-SAPI in
; ../../system/inventory.yml (php_floors) rather than by the presence of this
; file: `pl server-state php-check live` goes RED, and `pl host apply live
; --kind=php` refuses with SAPI-ABSENT and tells you to move the declaration —
; it will not create /etc/php/8.2/… back into existence. Pinned by
; tests/unit/test-php-floor.bats.
;
; NOTHING ELSE BELONGS IN THIS FILE. It is applied verbatim to a live SAPI, and
; the verb verifies it by sha256 — one floor, one line, reviewable at a glance.

max_input_vars = 5000
