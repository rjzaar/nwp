# Fixture vhost — fictional host, shipped so the capture-HYGIENE assertions in
# tests/unit/test-nginx-versioning.bats run on every machine and in CI, where
# the real per-host capture (a private per-server repo since ops#326) is absent.
server {
    listen 443 ssl;
    server_name fxsite.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/fxsite.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fxsite.example.invalid/privkey.pem;

    root /var/www/fxsite;
    index index.php;

    include /etc/nginx/snippets/deny-files-secrets.conf;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
