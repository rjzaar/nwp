# .pre-commit-config.yaml — P61 §4.3
# Install: pipx install pre-commit && pre-commit install
# See CONTRIBUTING.md "Leakage Gate" for details.
#
# This hook runs gitleaks against staged changes and refuses commits
# containing operator-specific identifiers (hostnames, paths, organisations)
# or generic credential patterns. To allow a legitimate reference, add a
# narrow path-pinned entry to .gitleaksignore with a one-line rationale.
#
# Bypass is `--no-verify` (locally only); CI gate (.gitlab-ci.yml) is
# non-bypassable.

repos:
  # Local hook so we can pass --config=.gitleaks.toml correctly; the
  # upstream gitleaks pre-commit hook's `entry` does not accept arbitrary
  # extra args via this file's `args:`, so we re-author the entry locally.
  - repo: local
    hooks:
      # The review mode is derived from `approvers:` in the private registry, and
      # projected into the tracked .nwp-review-mode because CI cannot read that repo.
      # Only a host with BOTH can compare them — i.e. here, not CI — which is why this
      # is a pre-commit hook: a projection contradicting the declared fact never
      # reaches a pipeline. Exits 2 (reported, not passed) where the registry is absent.
      - id: review-mode-projection
        name: "review mode matches the approvers list (anti-drift)"
        entry: scripts/ci/lint-review-mode-projection.sh
        language: script
        pass_filenames: false
        always_run: true
      # Private site names must not reach a publicly mirrored repo (ops#326,
      # ADR-0039). This runs at COMMIT time because on 2026-08-11 FIVE merge
      # requests were tripped by the CI job in one day — every one for a real
      # site name in PROSE: a comment citing a worked example, a fixture using
      # a site as an arbitrary label, a proposal naming the site it discusses.
      # Nobody thinks of a comment as a disclosure; on a public mirror it is
      # exactly that. Each cost a push, a pipeline, a diagnosis and a second
      # push. Runs in ~0.7s over the whole tree, and NOT on staged filenames:
      # a name can appear in a file this commit does not touch (a baseline row
      # going stale, a rename elsewhere). Fails CLOSED with exit 2 when the
      # deny-list is unreadable — it lives in private/, so a checkout without
      # it cannot claim the tree is clean. Bypass is --no-verify; the CI job
      # remains the non-bypassable gate.
      - id: site-names
        name: "no private site names (publicly mirrored repo)"
        entry: scripts/ci/lint-site-names.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: gitleaks (operator-specific ruleset)
        entry: gitleaks git --pre-commit --redact --staged --verbose --config=.gitleaks.toml --no-banner
        language: system
        pass_filenames: false

  # Commit-time syntax gate: bash -n on shell (this repo is ~90% bash), bats
  # --count on .bats, and php -l / phpcs / phpstan on PHP when — and only when
  # — those tools are actually installed. Missing PHP tooling prints one skip
  # line and passes; a real syntax error refuses the commit. See .hooks/pre-commit.
  #
  # types_or (not types: [php]) because the shell half is the half that matters
  # here: with types: [php] the hook never ran on a pure-bash commit at all.
  - repo: local
    hooks:
      - id: syntax-gate
        name: Syntax gate (bash -n, bats, php -l/phpcs — skips absent tools)
        entry: .hooks/pre-commit
        language: script
        types_or: [shell, php]
        pass_filenames: true
        stages: [pre-commit]
