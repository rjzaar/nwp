# Host-state inventory — the `live` sites box (prod-cluster; every live site
# after the 2026-07-31 split).
#
# Every entry here is load-bearing state that, before 2026-08-01, existed ONLY
# on the box. `pl server-state capture live` writes each one into this
# directory; `pl server-state diff live` proves the captured copy is still
# what is running. `why:` is mandatory in review: an artifact nobody can
# justify is an artifact nobody will maintain.
#
# ⚠ This box serves EVERY live site: 12 loaded vhosts under the SYSTEM nginx
# (systemd), Drupal on php8.3-fpm, Moodle (ssc live + ssd demo) on php8.2-fpm,
# MariaDB, postfix+opendkim outbound mail. It does NOT run GitLab — /opt/gitlab
# was purged in the split. Never apply the `nwpcode` box's gitlab-ctl idioms
# here (its certbot hook, its bundled-nginx reload path): the 2026-08-01 audit
# found exactly that class of carried-over config would have taken every site
# down on the next reboot (see servers/live/README.md). Every command below is
# read-only and cheap.
#
# No hostname appears in this file. `ssh_role` is resolved through `pl host`,
# which reads the operator's private instance manifest (leakage gate).

host: live
ssh_role: prod-cluster
ssh_user: gitlab

# ---------------------------------------------------------------------------
# Per-SAPI setting floors (the nwpcode 2026-07-26 lesson, applied here).
#
# The clone inherited the SAME fault the nwpcode outage was caused by: the
# max_input_vars remedy was applied to PHP 8.3, but ss.conf and ssd.conf pass
# to php8.2-fpm.sock and the ssc Moodle cron runs /usr/bin/php8.2 — so the
# SAPI that actually serves Moodle sits at the default 1000. These floors name
# the SAPI; `pl server-state php-check live` goes RED until the box is fixed.
# ---------------------------------------------------------------------------
php_floors:
  - sapi: "8.2/fpm"
    setting: max_input_vars
    min: 5000
    why: "Moodle course/section edit forms POST >1000 vars; ss.conf and ssd.conf -> php8.2-fpm.sock. Below this the form silently truncates and the save 500s. Measured 1000 (PHP default) on 2026-08-01."
  - sapi: "8.2/cli"
    setting: max_input_vars
    min: 5000
    why: "ssc Moodle cron (www-data crontab) and admin/cli/upgrade.php run under /usr/bin/php8.2. An upgrade that trips this leaves the site in maintenance mode. Measured 1000 on 2026-08-01."

artifacts:
  # --- the DR / backup leg -------------------------------------------------
  - id: cron-nwp-box-backup
    kind: file
    remote: /etc/cron.d/nwp-box-backup
    why: "Producer half of the fleet backup chain (site DBs + nginx tarball -> /var/backups/nwp-pull, nightly 01:30). The consumer half is the ci-host stick pull. Without this cron the box has NO backup at all."
  - id: nwp-box-backup-script
    kind: file
    remote: /usr/local/sbin/nwp-box-backup.sh
    why: "The DR producer itself. Post-split it must guard the absent gitlab-backup binary or the nightly run degrades to an empty gitlab/ dir that looks like a backup. The nwpcode copy lives in that box's own nested repo; this box's copy was unversioned until now."

  # --- TLS continuity ------------------------------------------------------
  - id: certbot-deploy-hook
    kind: file
    remote: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    repo_counterpart: servers/live/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    why: "Renewed certs are only loaded via this hook. The pre-split hook ran gitlab-ctl (purged with GitLab) under set -e, so certbot counted every successful renewal as a FAILURE and never loaded the new cert — ss2 failed daily for 19 days before it was caught (2026-08-01)."
  - id: certbot-webroot-map
    kind: cmd
    remote: 'grep -HE ''^(authenticator|webroot_path)[[:space:]]*='' /etc/letsencrypt/renewal/*.conf'
    why: "All 14 lineages renew via WEBROOT, and the webroot is not inferable from the site name (ss renews against /var/www/ssc). The 2026-08-01 renewal fix depends on each vhost's port-80 ACME carve-out pointing at exactly these paths; if a lineage or its path changes, the carve-out must follow."
  - id: nginx-acme-fastcgi-map
    kind: cmd
    remote: 'grep -HE ''fastcgi_pass|^[[:space:]]*root[[:space:]]|acme-challenge'' /etc/nginx/conf.d/*.conf'
    why: "The structural core of every loaded vhost: which SAPI serves each site (the denominators for php_floors — ss/ssd on 8.2-fpm, the rest on 8.3-fpm), each docroot, and the presence of the port-80 ACME carve-outs that keep renewals working. Full vhost text is mirrored in servers/live/nginx/conf.d/; this map makes drift in the load-bearing lines cheap to see."

  # --- the demo-reset machinery (nwd + ssd) --------------------------------
  - id: demo-reset-nwd
    kind: file
    remote: /usr/local/bin/nwd-demo-reset-restricted
    repo_counterpart: servers/live/demo/nwd-demo-reset-restricted
    counterpart_divergence: "Redaction-only: with the identity map applied to the repo file the two are byte-identical (verified 2026-08-01). The raw file can never match because the captured copy is identity-redacted — including the engine's substring substitution of the ai-host name inside the word 'minimum'. Judge real drift with the redaction applied."
    why: "The restricted wrapper the demo-reset key is forced into — the only sanctioned write path for nwd demo resets. Installed root-owned in /usr/local/bin; if it drifts from the repo copy, the jail is not what review approved."
  - id: demo-reset-ssd
    kind: file
    remote: /usr/local/bin/ssd-demo-reset-restricted
    repo_counterpart: servers/live/demo/ssd-demo-reset-restricted
    counterpart_divergence: "Same as demo-reset-nwd: redaction-only, byte-identical once the identity map is applied (verified 2026-08-01). Judge real drift with the redaction applied."
    why: "The Moodle (ssd) half of the demo reset — golden restore incl. the mdl_sessions purge (ops#168). Root-owned wrapper; drift here means the demo resets to something other than the reviewed golden state."
  - id: demo-state-layout
    kind: cmd
    remote: 'sudo -n find /var/lib/nwp-demo -maxdepth 2 2>/dev/null | sort'
    why: "The golden/harvest/last-reset layout both reset wrappers depend on. Listing only — the contents are site data and stay on the box. A missing golden/ here is a reset that will destroy the demo instead of restoring it."

  # --- scheduling that drives live sites -----------------------------------
  - id: moodle-cron-scheduler
    kind: cmd
    remote: 'sudo -n crontab -l -u www-data 2>/dev/null'
    why: "The ONLY Moodle cron on the box: ssc every 15 min under /usr/bin/php8.2 (this is what names the 8.2/cli floor). Note what is ABSENT: rgs, ss2, sso have no scheduler at all — captured so that gap is reviewable instead of assumed."
  - id: operator-crontab
    kind: cmd
    remote: 'crontab -l'
    why: "The ssh account's crontab runs the fin market monitor and the mt mass-times scraper (03:00 extraction) — mt's site content is stale without it. Neither job existed in any repo until now."
  - id: systemd-nwc-cron.timer
    kind: cmd
    remote: "systemctl cat nwc-cron.timer"
    why: "Drives live nwc Drupal cron every 15 min. nwc is member-facing; only nwc and ssc have any scheduler at all."
  - id: systemd-nwc-cron.service
    kind: cmd
    remote: "systemctl cat nwc-cron.service"
    why: "Unit invoked by nwc-cron.timer (www-data, drush core:cron against /var/www/nwc)."

  # --- the network boundary ------------------------------------------------
  - id: ufw
    kind: cmd
    remote: "sudo -n ufw status numbered 2>/dev/null || ufw status numbered"
    why: "22/tcp is ALLOW IN Anywhere (twice — OpenSSH profile + bare rule) contra the no-public-ssh standing rule, and 5050/tcp is world-open with NOTHING bound to it (carried over in the clone). 25/tcp is open because inbound mail (the avc reply-pipe) terminates here. Capturing it makes each gap reviewable."
  - id: sshd-essentials
    kind: cmd
    remote: 'sudo -n sshd -T 2>/dev/null | grep -E ''^(port|listenaddress|permitrootlogin|passwordauthentication|pubkeyauthentication|kbdinteractiveauthentication) '' | sort'
    why: "The box's only login surface. permitrootlogin=no and passwordauthentication=no are the properties that make the world-open port 22 survivable; sshd binds 0.0.0.0, not a tunnel interface — captured so the mons-tunnel end-state has a measured starting point."

  # --- the ssh trust boundary (redacted: options only, never key material) --
  - id: authorized-keys
    kind: ssh-policy
    remote: /home/gitlab/.ssh/authorized_keys
    why: "5 keys on an account with passwordless sudo — the forced-command options are the entire difference between 'demo-reset trigger' and 'root on every live site'. Redacted at capture: options and comments kept, key material never enters the repo."

  # --- outbound mail (signup/notification deliverability) ------------------
  - id: postfix-main
    kind: cmd
    remote: "postconf -n"
    why: "Mail leaves this box (Moodle + Drupal notifications, DKIM-milter on :8891). myhostname claimed the OLD box's fqdn until 2026-08-01 (fixed on-box that evening; the first drift this artifact ever caught was that very fix, ~18 min after the first capture). mydestination derives from it, so a wrong value silently changes which mail is accepted locally."
  - id: mail-aliases
    kind: cmd
    remote: 'grep -vE ''^[[:space:]]*(#|$)'' /etc/aliases'
    why: "The reply-pipe alias is the single hook routing inbound replies into avc-email-reply-pipe.sh; if it vanishes the email-reply feature dies silently (postfix just bounces)."
  - id: avc-email-reply-pipe
    kind: cmd
    remote: 'sudo -n sed -E ''s/^([[:alnum:]_]*(SECRET|TOKEN|PASSWORD|KEY)[[:alnum:]_]*)=.*/\1=<secret-redacted-at-capture>/'' /usr/local/bin/avc-email-reply-pipe.sh'
    why: "The pipe target invoked by postfix local(8) for the avc email-reply feature; runs on every inbound reply and was unversioned until now. NOT kind:file — the script embeds its webhook shared secret inline (an undeclared copy; the gitleaks commit gate caught it on the first capture), so the assignment is masked at capture and the value never enters the repo. The secret itself stays on the box and belongs in the secrets registry."
  - id: opendkim-conf
    kind: file
    remote: /etc/opendkim.conf
    why: "Outbound mail is only deliverable because it is DKIM-signed (non_smtpd_milters -> :8891). Config only; KeyTable/SigningTable/keys stay on the box."

  # --- the PHP settings map that php_floors is asserted against ------------
  - id: php-map
    kind: cmd
    remote: "for v in $(ls /etc/php 2>/dev/null); do for s in fpm cli; do [ -d /etc/php/$v/$s ] || continue; n=$(grep -rhs '^[[:space:]]*max_input_vars' /etc/php/$v/$s/php.ini /etc/php/$v/$s/conf.d/ 2>/dev/null | tail -1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[;#].*$//; s/[[:space:]]*$//'); echo \"$v/$s max_input_vars=${n:-1000}\"; done; done"
    why: "Feeds php_floors. NB the extraction takes the FIRST '=' and strips trailing comments — a greedy 's/.*=//' is exactly the bug that made the Moodle version audit return behind=0 forever."
