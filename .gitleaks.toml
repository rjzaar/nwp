# REVIEW (ops#131, 2026-07-26): the fleet smoke-test checklist is, by its
# nature, a list of the operator's live surfaces — a page of clickable links is
# the whole deliverable, so it cannot be genericised without destroying it.
# Path-pinned to that ONE file, on the same reasoning the SHARED-EXEMPTIONS
# block already applies to CLAUDE.md and docs/onboarding/. Detection is
# unchanged everywhere else, and the credential rules still apply to this file.
# ALTERNATIVE IF PREFERRED: move docs/guides/test-links.md into the private
# tree (~/central) and delete this allowlist.
[[rules.allowlists]]
description = "Fleet smoke-test checklist — a deliberate index of live surfaces (ops#131)."
paths = ['''^docs/guides/test-links\.md$''']

[[rules]]
id = "operator-organisation"
description = "Operator-specific organisation name leak"
# Bare `oblate` was previously included but false-positives on bibliographic
# mentions of unrelated Oblate orders (e.g. the 1864 David Lewis English
# translation of John of the Cross was "edited by Oblate Fathers" — Carmel
# project, 2026-05-22). The school tie is still caught via `omi` / `oblatesmi` /
# `oblates of mary immaculate`.
regex = '''(?i)\b(mazenod|mazenod\s+college|oblates?\s+of\s+mary\s+immaculate|oblatesmi|omi)\b'''
tags = ["leak", "organisation"]

