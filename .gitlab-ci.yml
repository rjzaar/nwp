# NWP GitLab CI/CD Configuration
#
# Complete CI/CD pipeline for NWP-managed Drupal sites
# Based on NWP roadmap P20 (GitLab CI Pipeline)
#
# Pipeline Stages:
#   database - Fetch/cache production database for testing
#   build    - Install dependencies, prepare environment
#   preview  - Per-MR preview environments
#
# Features:
# - Nightly database caching for faster builds
# - Production database import with sanitization
# - Automatic composer and npm builds
# - Test coverage reporting
# - Artifact management
#
# NOTE: Legacy deploy:staging / deploy:production jobs were deleted in
# F24 Phase 3 Step 1 — see ADR-0017 (trust model) for rationale. The
# replacement build-artifact → verifier handoff is tracked in F28.

stages:
  - lint
  - test
  - database
  - build
  - security
  - deploy
  - preview
  - e2e

################################################################################
# Global Variables
################################################################################

variables:
  # Site configuration
  SITE_NAME: ${CI_PROJECT_NAME}
  PHP_VERSION: "8.2"

  # Database configuration
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: drupal
  MYSQL_USER: drupal
  MYSQL_PASSWORD: drupal

  # Drupal configuration
  SIMPLETEST_DB: mysql://drupal:drupal@database/drupal
  SIMPLETEST_BASE_URL: http://web:8080
  BROWSERTEST_OUTPUT_DIRECTORY: /var/www/html/web/sites/simpletest/browser_output

  # Composer configuration
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_MEMORY_LIMIT: "-1"

  # DDEV configuration
  DDEV_NONINTERACTIVE: "true"

################################################################################
# Default Configuration
################################################################################

default:
  # Use DDEV-compatible image — pinned per F36 A-O3
  image: ddev/ddev-webserver:v1.24.8

  # Allow pipeline interruption for newer runs
  interruptible: true

################################################################################
# Measured-job template (F36 §6.5 / Phase 1.5)
#
# Apply to any job to record its duration + check against the adaptive
# threshold via lib/ci-stats.sh. The library handles bootstrap fallbacks
# (.ci-stats/bootstrap.yml) so freshly-added metrics don't break.
#
# Usage:
#   somejob:
#     <<: *measured
#     stage: lint
#     script:
#       - ...
#
# Persistence to the `stats` branch is a separate piece of work — until
# wired, TSVs are written locally per job and lost when the runner
# cleans up. See docs/reference/ci-stats.md for the operational plan.
#
# Intentionally NOT YET applied to existing jobs during the Phase 1.5
# soak period. Apply opportunistically in Phase 2+ once the persistence
# story is in place.
################################################################################

.measured: &measured
  before_script:
    - export NWP_JOB_START=$(date +%s)
  after_script:
    - duration=$(( $(date +%s) - ${NWP_JOB_START:-$(date +%s)} ))
    - outcome="${CI_JOB_STATUS:-success}"
    - ./lib/ci-stats.sh record "ci.${CI_JOB_NAME}.seconds" "$duration" "$outcome" 2>/dev/null || true
    - ./lib/ci-stats.sh check  "ci.${CI_JOB_NAME}.seconds" "$duration" warn 2>/dev/null || true

  # Retry on infrastructure failures
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

################################################################################
# Cache Configuration
################################################################################

# Cache composer dependencies globally
cache:
  key: "${CI_COMMIT_REF_SLUG}-composer"
  paths:
    - vendor/
    - web/core/
    - web/modules/contrib/
    - web/themes/contrib/
    - node_modules/
  policy: pull

################################################################################
# Workflow Rules
################################################################################

workflow:
  rules:
    # Run on merge request events
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run on scheduled pipelines (nightly database cache)
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Prevent duplicate pipelines for MRs
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Run on branch pushes
    - if: $CI_COMMIT_BRANCH

################################################################################
# SIGNATURE VERIFICATION (placeholder)
# REPORT-ONLY. Until 2026-07-26 this job's entire script was
#   echo "Signature verification — placeholder until signing is configured"
# with allow_failure: true — a green tick on a job called "verify-signature"
# that verified nothing, while CLAUDE.md states signed commits are mandatory.
# It now runs `git verify-commit` for real and prints the true signed/unsigned
# counts. It still exits 0, because configuring the signing key/hardware token
# on the authoring machines is an operator action an agent cannot perform — the
# point is that the gap is now VISIBLE in the log instead of asserted away.
# Flip by setting the CI variable NWP_REQUIRE_SIGNED_COMMITS=1 (no YAML edit).
################################################################################

verify-signature:
  stage: .pre
  script:
    - ./scripts/ci/verify-signature.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  tags:
    - nwp
  allow_failure: false   # the script itself is report-only; see the note above

################################################################################
# LINT STAGE
# Fast syntax and style validation
################################################################################

# Bash syntax validation (shell executor — no Docker image needed).
#
# Until 2026-07-26 this job was:
#     find scripts/commands lib -name "*.sh" -type f -exec bash -n {} \;
# `find -exec … \;` reports find's exit status, not the command's, so a file
# with a syntax error printed the error and the job exited 0 — proven on a probe
# tree. It was also `push`-only, and the workflow rule above kills branch
# pipelines once an MR is open, so bash linting could not run on the change
# being merged. Same shape as the test:unit MR gap fixed earlier the same day.
#
# The command lives in scripts/ci/lint-bash.sh so the acceptance test
# (tests/unit/test-ci-lint-commands.bats) exercises the same code CI runs.
lint:bash:
  stage: lint
  script:
    - ./scripts/ci/lint-bash.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  tags:
    - nwp

# yq-first enforcement (F36 A-C2 / ADR-0015). Refuses commits that reintroduce
# AWK YAML parsers in pl, scripts/commands/, or lib/. yq is the sanctioned YAML
# reader; AWK for non-YAML field extraction (du output, port parsing, printf
# arithmetic) remains fine.
#
# Until 2026-07-26 this was a LINE-WISE grep, wrong in both directions:
#   * false negative — every real offender in this repo is a multi-line
#     `awk '…' "$FILE"` block whose filename lands on the CLOSING line, so the
#     regex never saw `awk` and `.yml` together. The gate printed "OK — no AWK
#     YAML parsers found" while 122 of them existed, including the five in
#     verify.sh that compute .badges.json;
#   * false positive — a comment mentioning "awk" and "nwp.yml" reddened it.
#
# scripts/ci/lint-yq-first.sh tracks the quote across lines and resolves shell
# variables that hold a *.yml path. The 122 pre-existing parsers are recorded in
# .yq-first-baseline, which is SHRINK-ONLY: a new one fails the job, and a
# baseline line that no longer matches also fails (so converting one to yq
# forces you to delete its line).
lint:yq-first:
  stage: lint
  script:
    - ./scripts/ci/lint-yq-first.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - nwp

# Conflict-marker gate — refuses a tree with an unresolved merge in it.
#
# On 2026-07-26 commit 3c4c631 reached its MR with `<<<<<<< HEAD` / `=======` /
# `>>>>>>> c6ba428` sitting at lines 1031/1129/1246 of
# docs/reports/consolidation-arc-2026-07/decision-log.md — the append-only arc
# DECISION LOG — and the pipeline went green. Every other job passed over it,
# because not one of them looks for markers; a human reading a rebase caught it,
# which is not a control. Blocking, and cheap (one grep over tracked text files).
#
# Exit 2 = CANNOT VERIFY (not a git repo / zero files scanned) — fail closed,
# never silently green. Pinned by tests/unit/test-conflict-markers-gate.bats,
# which includes negative controls for Markdown setext-H1 `=======` underlines.
lint:conflict-markers:
  stage: lint
  script:
    - ./scripts/ci/lint-conflict-markers.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - nwp
  allow_failure: false

# The rollback registry's checkpoint ids must resolve to exactly one row.
# 2026-07-26: CP19 x3, CP20 x4, CP21 x3, CP22 x2 — three agents each read the
# file, each saw CP18 as the highest, each allocated "the next four". CP19 named
# both "item 2 recovery-path-repair" and "item 3 nested-repo-containment", i.e.
# two different restore commands under one name, in the document an operator
# reaches for mid-incident. Blocking, and fail-closed on an unreadable corpus.
lint:registry-ids:
  stage: lint
  script:
    - ./scripts/ci/lint-rollback-registry-ids.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - nwp
  allow_failure: false

# Leakage gate — refuses MRs / main pushes that introduce operator-specific
# identifiers (hostnames, paths, organisations) or generic credentials.
# Per P61 §4.4. Configure `main` branch protection to require this job to
# pass before merge.
lint:leakage:
  stage: lint
  # Shell runner (no Docker executor available): use the host gitleaks and scan ONLY
  # the new commits (MR diff / push range). A full-history scan is slow — it re-flags
  # thousands of already-reviewed historical strings — and was the stuck/timeout cause.
  variables:
    GIT_DEPTH: "0"   # need the base commit reachable for the <base>..HEAD range
  script:
    - |
      if ! command -v gitleaks >/dev/null 2>&1; then
        ver=8.30.0
        # sha256 of gitleaks_8.30.0_linux_x64.tar.gz, taken from the upstream
        # release checksums file AND independently recomputed from the download
        # on 2026-07-26. The yq bootstrap in test:unit has been sha256-pinned for
        # a while; this one was piping an unverified tarball straight into tar,
        # in the job that is the repo's only blocking secret gate.
        sha=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        echo "Installing gitleaks ${ver} (shell runner has no gitleaks, no Docker executor)..."
        curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
        echo "${sha}  /tmp/gitleaks.tgz" | sha256sum -c -
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
        rm -f /tmp/gitleaks.tgz
        export PATH="/tmp:$PATH"
      fi
      command -v gitleaks >/dev/null 2>&1 || { echo "gitleaks unavailable and auto-download failed"; exit 1; }
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      case "$base" in ""|0000000000000000000000000000000000000000) base="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)" ;; esac
      echo "gitleaks: scanning new commits only (${base}..HEAD)"
      gitleaks git --config=.gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="${base}..HEAD"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - nwp
  allow_failure: false

# Documentation-truth gate (P62 / ADR-0030). Runs `pl doc-truth`, which asserts
# the *structural* claims NWP docs make against the tree — every repo-relative
# markdown link resolves, and every `ADR-NNNN` mention resolves to a real
# docs/decisions file. Pre-existing rot is captured in `.doc-truth-baseline`
# (like `.gitleaksignore`), so the gate fails ONLY on NEW drift and is therefore
# safe to enforce (allow_failure: false). Scoped to MRs / main pushes that touch
# any markdown file. To accept intentional new drift: `pl doc-truth --baseline`.
lint:doc-truth:
  stage: lint
  # Shell runner (no Docker image needed): doc-truth.sh is pure bash + coreutils,
  # sources only lib/ui.sh, and reads the working tree — no site/composer needed.
  script:
    - 'echo "Checking documentation-truth (P62): structural doc claims vs the tree..."'
    - ./scripts/commands/doc-truth.sh --json || true   # machine summary to the log
    - ./scripts/commands/doc-truth.sh                  # human report; exit 1 on NEW drift
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.md"
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "**/*.md"
  tags:
    - nwp
  allow_failure: false

# Intersite change-impact classifier (P74 Phase 2 / boundary gate). Cloned from
# lint:doc-truth above. Runs `pl impact --json` on an MR to classify the diff
# INTERNAL vs BOUNDARY-TOUCHING against pairs/ssc.pair-contract.yml's `boundary:`
# block, and artifacts the JSON verdict. Uses the merge-base sha GitLab sets for
# MR pipelines as the compare base; a missing/unfetched base makes `pl impact`
# fail-safe CLOSED (⇒ BOUNDARY), never silently "internal".
#
# ADVISORY ONLY for now (allow_failure: true; the classifier itself exits 0):
# it informs, it does not block. The parts that BLOCK — the contract_version
# bump gate, CODEOWNERS review scoped to the boundary paths, and the schema
# compat (expand-contract) checker — are a LATER phase (P74 Phase 3); wire them
# here (and flip allow_failure) then. Shell runner: needs bash + git + yq (yq is
# what reads the boundary map; without it every diff would look internal).
#
# MANIFEST-HONESTY, AND WHY THIS JOB IS EXPECTED TO BE AMBER (item 7)
#   The `--honesty` step used to always exit 0 and print "clean". In THIS
#   pipeline `sites/*` is gitignored, so the nwc profile — which holds 10 of the
#   11 declared provider symbols — is not on the runner at all. The step was
#   therefore reporting a green boundary contract it had no way to inspect:
#   measured 2026-07-26, the identical check saw 0 candidate files here and 11
#   findings on a workstation with the profile checked out.
#
#   `pl impact --honesty` now separates the verdict from the corpus:
#       exit 0  VERIFIED CLEAN  every surface's provider tree was scanned
#       exit 1  VIOLATIONS      a boundary symbol leaked outside its paths
#       exit 2  CANNOT VERIFY   a surface's provider tree is not on disk
#   Until this runner has the nwc profile, exit 2 is the truthful answer and
#   this job will show AMBER (allow_failure: true) on every MR. That is the
#   intended state: loudly "I cannot see", never silently "all clear". Do NOT
#   silence it by passing --advisory — the flag exists for callers that have
#   already recorded the verdict elsewhere, not to repaint this job green.
#
#   The verifying path today is `pl impact --honesty` on a workstation, where
#   the profile exists (7/7 surfaces, VERIFIED CLEAN as of 2026-07-26). Flip
#   allow_failure to false once the corpus is available to the runner.
#
#   Note the `--honesty` step is also fail-closed on a missing yq: with no yq
#   the contract parses to zero surfaces and the check reports CANNOT-VERIFY
#   rather than "clean", which is how it behaved before.
boundary:classify:
  stage: lint
  script:
    - echo "Classifying diff against the nwc<->ssc boundary (P74 Phase 2)..."
    - BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-main}"
    - echo "Compare base ${BASE}"
    - ./scripts/commands/impact.sh --base="${BASE}"                 # human report
    - ./scripts/commands/impact.sh --base="${BASE}" --json | tee impact.json
    # Manifest honesty. Non-zero here means EITHER a real leak (1) OR "I could
    # not look" (2) — both are amber, and both are information the previous
    # always-exit-0 version destroyed.
    - ./scripts/commands/impact.sh --honesty
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - nwp
  allow_failure: true
  artifacts:
    when: always
    paths:
      - impact.json

# Intersite schema compatibility gate (P74 Phase 3 / expand-and-contract). For
# each changed contracts/*.schema.json, `pl contracts compat` diffs the new file
# against its git-committed old version and FAILS on a breaking delta (field
# removed, type narrowed, new required, enum value dropped, additionalProperties
# tightened) — a schema-registry's BACKWARD guarantee with only git history
# (research §2 layer 3). Provider-first ordering (the other half) is enforced by
# pair_guard. Scoped to MRs that touch contracts/** (rules:changes), so most
# changes never run it. BLOCKING (allow_failure:false): a breaking wire-shape
# change must be caught before it ships. Uses the MR merge-base as the compare
# base; an unresolvable base makes compat fail-safe CLOSED (checks every schema).
# Pure bash + python3 (stdlib) — no site/composer needed.
contracts:compat:
  stage: lint
  script:
    - echo "Checking intersite schema compatibility (P74 Phase 3 / expand-and-contract)..."
    - BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-main}"
    - echo "Compare base ${BASE}"
    - python3 contracts/validate.py            # schemas still self-valid + samples behave
    - ./scripts/commands/contracts.sh compat --base="${BASE}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "contracts/**"
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "contracts/**"
  tags:
    - nwp
  allow_failure: false

################################################################################
# TEST STAGE
# Unit and integration tests
################################################################################

# Unit tests (BATS)
#
# yq v4 is the sanctioned YAML reader (ADR-0015) and the unit suites for
# moodle-promote, pair-guard, boundary, sanitize-dispatch and delete-impact
# exercise lib code that reads fixture YAML through it. Without yq those libs
# fail closed (REFUSED) and 46 tests go red (ops#88).
#
# The `nwp`-tagged runner is a SHELL executor: `image:` is ignored and the
# apt-get line is a permission-denied no-op (kept for a future docker runner).
# So when the host has no yq on the runner user's PATH, bootstrap a pinned
# copy into a per-runner cache — same v4.44.1 that `pl setup` installs
# (scripts/commands/setup.sh install_yq), verified against the sha256 from
# the upstream release's published checksums file before every use.
test:unit:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq bats git php-cli || true
    - |
      YQ_VER=v4.44.1
      YQ_SHA256=6dc2d0cd4e0caca5aeffd0d784a48263591080e4a0895abe69f3a76eb50d1ba3
      if ! command -v yq >/dev/null 2>&1; then
        YQ_DIR="${HOME}/.cache/nwp-ci/yq-${YQ_VER}"
        mkdir -p "$YQ_DIR"
        if ! echo "$YQ_SHA256  $YQ_DIR/yq" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o "$YQ_DIR/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64"
        fi
        echo "$YQ_SHA256  $YQ_DIR/yq" | sha256sum -c -
        chmod +x "$YQ_DIR/yq"
        export PATH="$YQ_DIR:$PATH"
      fi
      yq --version
  # scripts/ci/run-bats.sh (a) preflights php/bats/yq/git and FAILS the job when
  # one is missing — the registered fallback runner has no php, and the two
  # tests in test-auth-logic.bats (SSO uid-lock decision + ops#81 erasure
  # Bearer/IP/issuer guard) used to `skip` in that case, which bats reports as
  # `ok`; (b) writes a real JUnit report — the job declared
  # `junit: tests/unit/results.xml` while bats was invoked WITHOUT
  # `--report-formatter junit --output`, so that file has never existed and
  # GitLab only *warned*, leaving the MR Test panel empty across ~1085 cases;
  # (c) asserts the report has >0 testcases and exactly NWP_BATS_MAX_SKIPPED
  # skips, so a suite that quietly stops running cases goes red.
  variables:
    NWP_BATS_REQUIRED_TOOLS: "bats git php yq"
    NWP_BATS_MAX_SKIPPED: "0"
  script:
    - ./scripts/ci/run-bats.sh .logs/junit/unit tests/unit/
  artifacts:
    when: always
    reports:
      junit: .logs/junit/unit/report.xml
    paths:
      - .logs/junit/unit/report.xml
    expire_in: 1 week
  rules:
    # MRs MUST run the unit suite. Until 2026-07-26 this was push-only, so every
    # "CI-verified" merge was verified WITHOUT bats — that is how the ops#47
    # impact-contract regression reached main with a green pipeline. A gate that
    # cannot fail on the change being merged is decoration, not assurance.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  tags:
    - nwp

# Integration tests (BATS).
#
# Until 2026-07-26 this job ran ONE file — 06-scripts-validation.bats, 25
# existence / `bash -n` / --help assertions — under the name "test:integration".
# The 45 real lifecycle cases in 01-install .. 05-deployment never ran in CI at
# all. 31 of those 45 need no ddev and were simply never invoked; the other 14
# guard on ENABLE_DDEV_TESTS and would `skip`, which bats reports as `ok`.
#
# The job now runs the whole directory and declares the shortfall: the budget
# lives in tests/.skip-budget (integration=14), read by run-bats.sh, which is
# also what `pl test --integration` calls. Exceed it and the job goes red; drop
# below it and the runner tells you to lower the number in the same MR.
#
# Provisioning ddev on the runner is the way to burn the 14 down — see ops#47.
test:integration:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq bats git
  variables:
    NWP_BATS_REQUIRED_TOOLS: "bats git"
    NWP_BATS_SUITE: "integration"
  script:
    - ./scripts/ci/run-bats.sh .logs/junit/integration tests/integration/
  artifacts:
    when: always
    reports:
      junit: .logs/junit/integration/report.xml
    paths:
      - .logs/junit/integration/report.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  tags:
    - nwp
  allow_failure: false

# NWP Verification System (P50)
# Runs machine verification checks and generates badges
test:verification:
  stage: test
  image: ubuntu:22.04
  # Shell executor: image is ignored and apt-get is a permission-denied no-op
  # (|| true). verify.sh reads YAML via yq, so bootstrap the same pinned,
  # sha256-verified v4.44.1 into a per-runner cache as test:unit does.
  before_script:
    - apt-get update -qq && apt-get install -y -qq bash git jq bc || true
    - |
      YQ_VER=v4.44.1
      YQ_SHA256=6dc2d0cd4e0caca5aeffd0d784a48263591080e4a0895abe69f3a76eb50d1ba3
      if ! command -v yq >/dev/null 2>&1; then
        YQ_DIR="${HOME}/.cache/nwp-ci/yq-${YQ_VER}"
        mkdir -p "$YQ_DIR"
        if ! echo "$YQ_SHA256  $YQ_DIR/yq" | sha256sum -c - >/dev/null 2>&1; then
          curl -fsSL -o "$YQ_DIR/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64"
        fi
        echo "$YQ_SHA256  $YQ_DIR/yq" | sha256sum -c -
        chmod +x "$YQ_DIR/yq"
        export PATH="$YQ_DIR:$PATH"
      fi
      yq --version
  script:
    - echo "Running NWP verification checks..."
    - ./scripts/commands/verify.sh ci --depth=basic --export-json
  artifacts:
    when: always
    paths:
      - .badges.json
      - .logs/verification/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - nwp
  allow_failure: true

# DELETED 2026-07-26: `update-badges`.
#
# The README carried an "Automated Tests 90%" badge sourced from .badges.json,
# which was decoupled from CI on four independent axes:
#   1. the committed .badges.json was generated 2026-02-02 with
#      "pipeline": {"id": "local"} — i.e. by hand, not by a pipeline;
#   2. shields.io read it from raw.githubusercontent.com, a mirror this
#      self-hosted repo does not push to;
#   3. the job pushed to the self-hosted host and was allow_failure: true, so
#      a failed push was invisible;
#   4. its `changes:` rules listed .verification.yml / verify.sh /
#      verify-runner.sh — none of which change when test RESULTS change.
#
# Rebuilding that machinery is more work than the signal is worth, and a stale
# "90%" badge is an active liability. The README now links to the pipeline,
# which is always current and costs nothing. `test:verification` above still
# runs and still artifacts .badges.json for anyone who wants the numbers.

################################################################################
# DATABASE STAGE
# Fetch and cache production database for testing
################################################################################

# Nightly database caching job
# Runs on schedule to fetch and cache production database
# Artifacts expire after 1 day and are used by other jobs
database:nightly:
  stage: database
  rules:
    # Only run on scheduled pipelines (configure schedule in GitLab)
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - echo "Fetching and caching production database..."
    - ./scripts/ci/fetch-db.sh --sanitize
  artifacts:
    paths:
      - .data/db.sql.gz
    expire_in: 1 day
  tags:
    - nwp
  # Allow failure to not block other scheduled jobs
  allow_failure: true

# Database job for regular builds
# Uses cached database from nightly job if available
# Falls back to fetching fresh database if cache is stale
database:
  stage: database
  rules:
    # Skip on scheduled pipelines (nightly job handles this)
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Only when the repo is an actual Drupal site — this job fetches/sanitises a prod
    # DB to feed `build`, which is itself gated on composer.json. The NWP meta-repo has
    # no composer.json (and no site to back up), so skip here instead of failing.
    - exists:
        - composer.json
  script:
    - echo "Checking for cached database..."
    - |
      if [ -f .data/db.sql.gz ]; then
        echo "Using cached database from nightly job"
      else
        echo "No cache available, fetching fresh database..."
        ./scripts/ci/fetch-db.sh --sanitize
      fi
  artifacts:
    paths:
      - .data/db.sql.gz
    expire_in: 1 hour
  cache:
    # Pull cache only
    policy: pull
  tags:
    - nwp
  # Allow failure for non-blocking database issues
  allow_failure: true

################################################################################
# BUILD STAGE
# Install dependencies, build assets, import database, run deployment
################################################################################

build:
  stage: build
  needs: ["database"]
  # Only run when the repo is an actual Drupal site (composer.json at root).
  # The NWP meta-repo itself has no composer.json, so this job is skipped
  # there — build.sh assumes a DDEV site and cannot run against the meta-repo.
  rules:
    - exists:
        - composer.json
  script:
    - echo "Starting build process for ${SITE_NAME}..."
    - apt-get update -qq
    - apt-get install -y -qq docker.io docker-compose
    - ./scripts/ci/build.sh
    - echo "Build completed successfully"
    - ddev describe || true
  artifacts:
    paths:
      - vendor/
      - web/
      - node_modules/
      - .logs/
    reports:
      dotenv: build.env
    expire_in: 1 hour
  cache:
    # Update cache with new dependencies
    key: "${CI_COMMIT_REF_SLUG}-composer"
    paths:
      - vendor/
      - web/core/
      - web/modules/contrib/
      - web/themes/contrib/
      - node_modules/
    policy: pull-push
  tags:
    - nwp
  timeout: 30 minutes

# Coverage check job
# Validates test coverage meets threshold
coverage:
  stage: build
  needs: ["build"]
  # Same gate as build: meta-repo has no PHPUnit coverage to check.
  rules:
    - exists:
        - composer.json
  script:
    - echo "Checking code coverage..."
    - |
      if [ -f .logs/coverage/clover.xml ]; then
        ./scripts/ci/check-coverage.sh 80 .logs/coverage/clover.xml
      else
        echo "No coverage report found, skipping coverage check"
        exit 0
      fi
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: .logs/coverage/cobertura.xml
    paths:
      - .logs/coverage/
    expire_in: 1 week
  coverage: '/^\s*Lines:\s*\d+\.\d+\%/'
  tags:
    - nwp
  allow_failure: true

################################################################################
# SECURITY STAGE
# Security scanning for vulnerabilities and malicious code
#
# SPLIT 2026-07-26. Until then this whole stage was UNREACHABLE: both jobs (and
# only these two) sat behind `rules: - exists: [composer.json]`, and there is no
# composer.json at the root of nwp/nwp. Even had it run, every check ended in
# `|| echo "WARNING: …"`, the `secrets_found` / `suspicious_found` variables
# were assigned and never read, and both jobs were `allow_failure: true` — three
# independent reasons neither could ever go red.
#
#   security:scan  — the parts that genuinely need a Drupal-site build
#                    (composer/npm audit). Still composer.json-gated, still
#                    advisory: a new CVE can appear with no code change, so this
#                    one reports rather than blocks — by design, stated here.
#   security:meta  — the parts that only need the repo. Ungated, baselined,
#                    and able to fail.
#   security:review — was CLAUDE.md's red-flag checklist rendered as literal
#                    `echo` lines. Now an assertion.
################################################################################

# Dependency advisories for Drupal-site pipelines (needs build artifacts).
security:scan:
  stage: security
  needs: ["build"]
  rules:
    - exists:
        - composer.json
  script:
    - echo "=== Composer Security Audit ==="
    - |
      if [ -f composer.json ]; then
        composer audit || echo "ADVISORY: vulnerabilities found in composer dependencies"
      else
        echo "No composer.json found, skipping composer audit"
      fi
    - echo ""
    - echo "=== NPM Security Audit ==="
    - |
      if [ -f package.json ]; then
        npm audit --audit-level=high 2>/dev/null || echo "ADVISORY: vulnerabilities found in npm packages"
      else
        echo "No package.json found, skipping npm audit"
      fi
  tags:
    - nwp
  # ADVISORY BY DESIGN: upstream advisories land without any change to this
  # repo, so blocking every MR on them punishes the wrong commit. `pl audit`
  # (per-site awareness → pl rag) is the surface that tracks them over time.
  allow_failure: true

# Meta-repo security checks — the half that never needed composer.json.
# Runs scripts/ci/security-meta.sh over `git ls-files`: credential shapes, AWS
# keys, private-key blocks, dynamic code execution, obfuscation, and
# world-writable tracked files. Pre-existing findings live in
# .security-meta-baseline (shrink-only, same contract as .yq-first-baseline),
# so this is enforceable on day one AND can only get stricter.
security:meta:
  stage: security
  needs: []
  script:
    - ./scripts/ci/security-meta.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - nwp
  allow_failure: false

# Merge-request review gate.
#
# The old job printed a scope analysis and then this, verbatim, as its finale:
#     echo "Review: Does the diff match the MR title and description?"
#     echo "Red flags:"
#     echo "  - Large changeset for small fix"
# — CLAUDE.md's checklist as `echo` statements, asserting nothing, allow_failure.
#
# The scope analysis below is genuinely informational and stays as prints. The
# one claim that CAN be made mechanically is now made: a diff touching a
# CLAUDE.md "Sensitive File Paths" entry must carry a `REVIEW:` marker in the MR
# title or a commit subject. That does not judge the change; it refuses to let a
# two-person-approval-class change through unlabelled.
security:review:
  stage: security
  needs:
    - job: build
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - echo "=== Merge Request Review ==="
    - 'echo "MR Title: $CI_MERGE_REQUEST_TITLE"'
    - 'echo "Source: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME → $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"'
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - echo ""
    - echo "=== Scope (informational) ==="
    - |
      files_changed=$(git diff --name-only origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD | wc -l)
      echo "Files changed: $files_changed"
      [ "$files_changed" -gt 20 ] && echo "INFO: large changeset — thorough review recommended"
      git diff --stat origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD | tail -1
      true
    - echo ""
    - echo "=== Dependency changes (informational) ==="
    - |
      if git diff origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD -- composer.json package.json 2>/dev/null | grep -q "^+[^+]"; then
        echo "INFO: dependencies modified — review required"
      else
        echo "OK: no dependency changes"
      fi
    - echo ""
    - echo "=== Sensitive-path REVIEW marker (blocking) ==="
    - ./scripts/ci/review-marker-gate.sh
  tags:
    - nwp
  allow_failure: false

# Console pytest suite (P-console). 224 assertions across 10 modules — including
# test_authz.py and test_notify.py, the runtime half of the Gotify `security`
# detector — ran in NO CI job and behind no `pl` verb until 2026-07-26, and
# pytest was declared nowhere.
#
# scripts/ci/test-console.sh runs a COLLECTION PREFLIGHT first and compares the
# collection-error count with scripts/ci/.console-collect-baseline (currently 0),
# because N collection errors means N modules' worth of assertions silently did
# not run. It also pins the skipped-test count. Measured clean locally on
# 2026-07-26 (223 passed, 1 skipped: optional faster_whisper).
#
# Shipped blocking. It was going to start `allow_failure: true` because the
# `pip install` step is the first of its kind on this shell runner, but pipeline
# 994 ran it end to end (`487 passed, 1 skipped`, `skipped=1 skip_baseline=1`),
# so the caveat no longer applies. A gate left non-blocking after it has been
# proven to work is exactly the defect class this file's other jobs suffered.
test:console:
  stage: test
  needs: []
  before_script:
    - python3 -m venv .venv-console
    - .venv-console/bin/pip install -q -r scripts/console/requirements.txt -r scripts/console/requirements-dev.txt
  script:
    - PYTEST=.venv-console/bin/pytest ./scripts/ci/test-console.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "scripts/console/**/*"
        - "scripts/ci/test-console.sh"
        - "scripts/ci/.console-collect-baseline"
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "scripts/console/**/*"
        - "scripts/ci/test-console.sh"
        - "scripts/ci/.console-collect-baseline"
  tags:
    - nwp
  allow_failure: false

################################################################################
# Scheduled Pipeline Configuration
################################################################################
#
# To enable nightly database caching:
#
# 1. Go to: Settings > CI/CD > Schedules
# 2. Click "New schedule"
# 3. Configure:
#    - Description: "Nightly database cache"
#    - Interval: "0 2 * * *" (2 AM daily)
#    - Target branch: main
#    - Variables: (none needed)
# 4. Save pipeline schedule
#
# The database:nightly job will run and cache the production database
# for use by builds throughout the next day.
#
################################################################################

################################################################################
# PREVIEW ENVIRONMENTS
# Create isolated preview environments for merge requests
################################################################################

# Deploy preview environment for merge requests
# Creates an isolated DDEV environment for testing PR changes
deploy:preview:
  stage: preview
  needs: ["build"]
  rules:
    # Only run for merge requests, and only for Drupal-site repos.
    # The NWP meta-repo has no .ddev/ project to preview.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - composer.json
  script:
    - echo "Creating preview environment for MR $CI_MERGE_REQUEST_IID..."

    - |
      if ! command -v ddev >/dev/null 2>&1; then
        echo "Installing DDEV..."
        curl -fsSL https://raw.githubusercontent.com/ddev/ddev/master/scripts/install_ddev.sh | bash
      fi
    - ./scripts/ci/create-preview.sh "mr-$CI_MERGE_REQUEST_IID"
    - |
      if [ -f .preview-env ]; then
        source .preview-env
        echo "PREVIEW_URL=$PREVIEW_URL" > preview.env
        echo "Preview environment available at: $PREVIEW_URL"
      fi

  environment:
    name: preview/mr-$CI_MERGE_REQUEST_IID
    url: https://mr-$CI_MERGE_REQUEST_IID.ddev.site
    on_stop: cleanup:preview
    auto_stop_in: 1 week
  artifacts:
    reports:
      dotenv: preview.env
    paths:
      - .preview-env
    expire_in: 1 week
  tags:
    - nwp
  allow_failure: false

# Cleanup preview environment
# Runs manually or when MR is closed
cleanup:preview:
  stage: preview
  needs: []
  rules:
    # Manual cleanup for open MRs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - echo "Cleaning up preview environment for MR $CI_MERGE_REQUEST_IID..."
    - |
      if ! command -v ddev >/dev/null 2>&1; then
        echo "Installing DDEV..."
        curl -fsSL https://raw.githubusercontent.com/ddev/ddev/master/scripts/install_ddev.sh | bash
      fi
    - ./scripts/ci/cleanup-preview.sh "mr-$CI_MERGE_REQUEST_IID" || true
    - echo "Preview environment cleaned up"

  environment:
    name: preview/mr-$CI_MERGE_REQUEST_IID
    action: stop
  tags:
    - nwp
  allow_failure: true

################################################################################
# Usage Examples
################################################################################
#
# Standard workflow:
#   1. Developer pushes to feature branch
#   2. Pipeline runs: database → build
#   3. Developer creates merge request
#   4. Pipeline runs again: database → build → preview
#   5. Preview environment created with unique URL
#   6. Review and test in preview environment
#   7. Merge to main after approval
#   8. Preview environment auto-cleans up after 1 week
#
# Deployment to staging/production is not performed by this pipeline;
# see F28 for the planned build-tier → verifier → prod signed-artifact handoff.
#
# Nightly workflow:
#   1. Scheduled pipeline runs at 2 AM
#   2. database:nightly job fetches and caches DB
#   3. Cache available for all builds during the day
#   4. Next night, cache refreshes
#
# Preview environment workflow:
#   1. Open merge request
#   2. CI creates preview environment (preview/mr-123)
#   3. Access preview at https://mr-123.ddev.site
#   4. Test changes in isolated environment
#   5. Manual cleanup available via GitLab UI
#   6. Auto-cleanup after 1 week of inactivity
#
################################################################################

################################################################################
# E2E STAGE
# End-to-end tests on Linode infrastructure (nightly only)
################################################################################

# E2E: Fresh install test
e2e:fresh-install:
  stage: e2e
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git ssh
  script:
    - echo "E2E tests not yet implemented - placeholder job"
    - echo "See tests/e2e/README.md for planned implementation"
    - ./tests/e2e/test-fresh-install.sh || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: manual
  timeout: 2h
  tags:
    - nwp
  allow_failure: true
  after_script:
    - echo "Cleanup would run here"

# E2E: Production deployment test
e2e:production:
  stage: e2e
  image: ubuntu:22.04
  script:
    - echo "E2E production tests not yet implemented"
    - 'echo "Future: Test staging -> production deployment"'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: manual
  timeout: 3h
  tags:
    - nwp
  allow_failure: true

