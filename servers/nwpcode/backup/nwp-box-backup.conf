# nwp-box-backup.conf — nwpcode (the FORGE box, git.nwpcode.org)
#
# THE DECLARED BACKUP LEGS FOR THIS HOST. Installed to /etc/nwp-box-backup.conf
# by `pl host apply nwpcode --kind=backup --execute`; read (never sourced) by
# /usr/local/sbin/nwp-box-backup.sh.
#
# WHY A DECLARATION EXISTS AT ALL (nwp/ops#332). From inside the producer,
# "this host has no site databases" and "the database server is down" are the
# same observation: an empty result. Inferring the first from the second is how
# the nightly reported success for six nights while producing nothing. So the
# host has to SAY which legs it owns, and the producer grades itself against
# what was said. A leg nobody declared can only ever be CANNOT VERIFY.
#
# Values: required | none.  Anything else — including a missing file or a
# missing key — reads as UNDECLARED, which is the stricter direction.
#
# A declaration is not a licence: if this file says `none` and the producer
# finds the thing anyway, that is a FAILURE, because it means real data is
# going unbacked behind a declaration that stopped being true.

# Site databases. Measured 2026-08-10: this box has mysql/mysqldump installed
# but no mysqld/mariadb running at all (systemctl inactive, no socket, no
# process), because the 2026-07-31 box split moved every Drupal/Moodle site to
# the live-sites box. What is left here is GitLab plus two STATIC webroots,
# which have no databases. The moved sites are backed up by that box's own
# leg — nothing is unbacked. If a database ever comes back to this box, the
# producer fails LOUDLY on this line rather than quietly skipping it.
SITE_DB_LEG=none

# GitLab application backup. This box is the forge; the tarball leg is the whole
# point of its nightly.
GITLAB_LEG=required
