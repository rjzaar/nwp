          path: /admin/user.php
          admin_only: true

# Session controls. Neither site can be signed out FROM the console: Drupal's
# user.logout route requires _csrf_token and Moodle's logout.php requires a
# sesskey — both are session-bound tokens the console does not have and must
# not have. What each of these IS is a one-click confirm page on the site
# itself. Measured 2026-08-11.
session:
  provider:
    signout:
      label: Sign out of the community site
      path: /user/logout/confirm
      route: user.logout.confirm
      note: >-
        Drupal REFUSES a one-time login link while a session exists
        (user.reset.login requires _user_is_logged_in: FALSE), so this is the
        step that makes the next jump work.
  consumer:
    signout:
      label: Sign out of the learning site
      path: /login/logout.php
      note: >-
        Shows Moodle's own logout confirmation; harmless when already signed
        out (it redirects to the front page).
