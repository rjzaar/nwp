# The invite-code registry's ONE writable home — ops#328 D1.
#
# Operator ruling 2026-08-09: the registry's home is mini (100.64.0.2, the
# always-on console/agent host) — "so everything works without this laptop".
#
# WHY A DECLARED FACT, NOT A PROBE. The ops#173 model ("the home is the host
# that can deliver") stopped selecting a single host the day mini gained a
# delivery path: both the workstation and mini passed demo_require_delivery,
# both wrote their own sites/<site>/demo-codes.json, and by 2026-08-09 the two
# had diverged to 63 rows/26 active vs 72 rows/35 active while live enforced
# 31. Delivery capability is NECESSARY for a write, but only this declaration
# is SUFFICIENT: every registry-writing verb compares `hostname -s` against
# registry_home and refuses anywhere else (demo_require_registry_home in
# scripts/commands/demo.sh). Reads work anywhere; an UNDECLARED or unparseable
# home fails writes CLOSED (exit 2 CANNOT VERIFY).
#
# CHANGING THIS VALUE IS AN OPERATOR RULING, not a refactor — it moves where
# invite codes may be minted. tests/unit/test-demo.bats pins the value so the
# change is always deliberate. Escape hatch for a one-off write elsewhere:
# NWP_DEMO_REGISTRY_HOME_OVERRIDE='<why>' — ledgered to sites/<site>/demo-reset.log.
registry_home: mini

# THE INVITE PACKS LIVE WITH THE REGISTRY — operator ruling 2026-08-11
# ("they should be on mini"). A pack (sites/<site>/demo-invites/invite-*.md) is
# the ONLY surviving copy of a code's plaintext; one sitting on any other host
# is plaintext invite codes in a place no verb looks after — not in the home's
# backup pull, invisible to `pl demo codes … reveal`, and duplicated across two
# machines. New packs already land here by construction (invite mints codes, so
# the D1 home guard means it only runs on the home), and
# `pl demo codes <site> packs relocate --apply` moves strays.
#
# The endpoint below is what `packs relocate` pushes to. It lives in THIS file
# for the same reason the hostname does: the home's identity is a declared fact
# with exactly one home of its own, and code/help stay hostname-generic (the
# P61 leakage rule). It is a private mesh address, not a credential — the
# transport is the caller's existing ssh key, which is never named here.
registry_home_ssh: rob@100.64.0.2
