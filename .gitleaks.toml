# .gitleaks.toml — public NWP leakage gate (P61 §4.1)
#
# This file is the ONE blocking security gate on every merge request and every
# push to main (`lint:leakage`, allow_failure: false). Read these three rules
# before editing it; `tests/unit/test-leakage-gate.bats` enforces all of them.
#
# RULE 1 — NEVER put a `paths` exemption in the top-level [allowlist].
#   A top-level allowlist disables *every* rule for that path, including the
#   inherited AWS / GCP / GitHub / GitLab-PAT credential rules from
#   [extend] useDefault. Until 2026-07-26 this file exempted ^tests/.*,
#   ^docs/reports/.*, ^docs/archive/.*, ^docs/onboarding/.*, ^templates/.* and
#   ^servers/(mini|mayo1|nwpcode)/.* globally: a byte-identical file carrying a
#   glpat- token was flagged under lib/ and found ZERO times in any of those
#   trees. The exemptions were only ever meant to silence operator-identifier
#   false positives; they silently switched off credential detection too.
#   Path exemptions therefore live on the operator-identifier rules ONLY, in
#   the SHARED-EXEMPTIONS block that is repeated verbatim under each of them.
#
# RULE 2 — if the gate is too noisy, add a FINGERPRINT to .gitleaksignore with
#   a rationale comment. Never widen a path exemption to quieten a real hit.
#   Only the 3-part `path:rule-id:line` fingerprint form works (2-part
#   `path:rule-id` entries are silently inert — verified on 8.21.2 and 8.30.0
#   in both `gitleaks dir` and `gitleaks git` mode).
#
# RULE 3 — the SHARED-EXEMPTIONS block is duplicated on purpose. gitleaks TOML
#   has no includes, and the DRY alternative ([[allowlists]] + targetRules) is
#   SILENTLY IGNORED below gitleaks 8.25 — the config would mean different
#   things on different runners, which is precisely the failure class this gate
#   exists to prevent. test-leakage-gate.bats asserts every copy is
#   byte-identical, which is what makes the duplication safe. Edit one, edit
#   all, and run the test.
#
# When a new operator-bound role name appears in instance-manifest.yml, add it
# to internal-bare-hostname's regex.

title = "NWP leakage gate"

# minVersion is advisory: this config is verified to behave IDENTICALLY on
# gitleaks 8.21.2 and 8.30.0 (the release lint:leakage installs). It uses no
# feature that changes meaning between them.
minVersion = "v8.21.0"

[extend]
useDefault = true   # inherit AWS / GCP / GitHub / GitLab / Slack / etc. credential rules

# NOTE: there is deliberately NO top-level [allowlist] `paths` list. See RULE 1.
# gitleaks' own default config already exempts `gitleaks\.toml`, binaries,
# lockfiles and vendor trees globally; that is enough.

[[rules]]
id = "operator-home-path"
description = "Hardcoded operator home directory leak"
# THE CAPTURE GROUP IS LOAD-BEARING — do not "simplify" it away.
# gitleaks >= 8.25 ships a DEFAULT global allowlist regex
# `^/(?:bin|etc|home|opt|tmp|usr|var)/[\w ./-]+$`, matched against the reported
# SECRET. With the old bare-path regex the whole secret was exactly that shape,
# so the rule was 100% dead on gitleaks 8.30.0 — the release lint:leakage
# downloads — while still firing on the dev box's older 8.21.2. Capturing the
# USERNAME makes the reported secret `rob`, not `/home/rob/`, which the default
# allowlist does not match; verified firing on 8.21.2 AND 8.30.0, including a
# bare path alone at column 0. `secretGroup = 1` states explicitly what gitleaks
# would otherwise infer from the single group. Reverting either the group or
# `secretGroup` fails tests/unit/test-leakage-gate.bats cases 2 and 3.
regex = '''/home/([a-z][a-z0-9_-]+)/'''
secretGroup = 1
tags = ["leak", "path"]

[[rules.allowlists]]
description = "Operator-bound paths: files whose PURPOSE is to name the operator's own machines, homes, hosts and org. Credential rules still apply to all of them."
# --- SHARED-EXEMPTIONS BEGIN ---
paths = [
  # Operator's machine map (Distributed Actor Glossary) — by design.
  '''^CLAUDE\.md$''',
  # Test verification ledger — references operator's tier hosts intentionally.
  '''^\.verification\.yml$''',
  # Internal ops tooling that legitimately names operator infra (same class as
  # CLAUDE.md): the GitLab webhook receiver and the Saint School admin-reset helper.
  '''^scripts/agent-loop/gitlab-webhook-receiver\.py$''',
  '''^scripts/ss-admin-reset\.sh$''',
  # Archive directory holds historical infrastructure documents — defeats the purpose to scrub.
  '''^docs/archive/.*''',
  # Coder onboarding docs deliberately name operator infrastructure — that's their
  # teaching purpose. Same shape as CLAUDE.md.
  '''^docs/onboarding/.*''',
  # Servers tree is operator-specific (F33 §4.1); scheduled to move to nwp-instances/_servers.
  '''^servers/(mini|mayo1|nwpcode)/.*''',
  # Role vocabulary doc must cite the banned tokens (it's the rule definition).
  '''^docs/reference/role-vocabulary\.md$''',
  # The proposals that define the rule must cite the tokens they ban.
  '''^docs/proposals/F34-role-label-proposal-rewrite\.md$''',
  '''^docs/proposals/P61-leakage-hygiene-ci\.md$''',
  # CHANGELOG mentions the pre-restart archive remote and historical org names.
  '''^CHANGELOG\.md$''',
  # Migration script maps legacy hostnames to role labels — has to name them.
  '''^lib/migrations/global/migrate_002_to_003\.sh$''',
  # F15 documents the conventional gitlab system service-account home
  # (/home/gitlab/.ssh) — a well-known service account, not the operator's home.
  '''^docs/proposals/F15-ssh-user-management\.md$''',
  # Audit-authors script encodes the operator's name regex on purpose.
  '''^bin/audit-authors\.sh$''',
  # Example and template files demonstrate placeholder values that look
  # hostname-shaped but are explicitly mysite.example.com / yourname.local style.
  '''^example\.nwp\.yml$''',
  '''^example\.nwp\.v2\.yml$''',
  '''^\.nwp-developer\.example\.yml$''',
  '''^templates/.*''',
  # The pl CLI's help-text examples reference mysite.example.com etc.
  '''^pl$''',
  # Test fixtures intentionally include leaky-looking content for the test.
  '''^tests/.*''',
  # The gitleaksignore file itself names the patterns it ignores.
  '''^\.gitleaksignore$''',
  # Historical reports document the operator's original infrastructure
  # — same principle as docs/archive/ being exempt.
  '''^docs/reports/.*''',
  # The agent-loop crontab.entry is operator-specific documentation; cron has no
  # $HOME so the path has to be absolute.
  '''^scripts/agent-loop/crontab\.entry$''',
  # Verifier-host (ver/mons) setup kit — operator-bound files that must name the
  # host they configure.
  '''^scripts/mons-setup\.sh$''',
  '''^docs/guides/mons-verification\.stanza\.yml$''',
  '''^docs/guides/mons-operational-readiness\.md$''',
  # nwd nightly demo-reset runbook (ops#133): an operator-bound server-access
  # runbook whose whole content is "which key, on which host, may run what".
  '''^docs/guides/demo-nightly-on-met\.md$''',
]
# --- SHARED-EXEMPTIONS END ---

