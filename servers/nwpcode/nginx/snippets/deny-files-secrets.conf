# deny-files-secrets.conf — refuse to SERVE credential-bearing files that can
# appear under a site's PUBLIC files/ directory.
#
# Why this exists: Drupal's config-sync export can be written under the public
# files tree (…/sites/default/files/sync/*.yml) and those YAMLs can carry live
# secrets (a real incident: a config-sync file held a glpat token AND a
# webhook_secret). Composer auth.json and dotenv files can likewise slip in.
# On this box the sites are served by GitLab's bundled NGINX, so a Drupal
# `.htaccess` deny does NOTHING — nginx must enforce it. This snippet is the
# HTTP-serving layer of a 3-part defence:
#   1. files are chmod-locked on disk,
#   2. this nginx deny (so they are never served publicly),
#   3. lib/sanitizers/files-secrets.sh redacts them from any export artifact,
#      and scripts/commands/server-backup.sh --exclude keeps them out of DR.
#
# Install (on the box, as root):
#   sudo install -m 0644 deny-files-secrets.conf \
#       /etc/nginx/snippets/deny-files-secrets.conf
# then add ONE line inside every Drupal server{} block, BEFORE the generic
# `location ~ \.php$ { … }` and try_files handlers so it wins:
#   include /etc/nginx/snippets/deny-files-secrets.conf;
# validate + reload with GitLab's bundled nginx:
#   sudo /opt/gitlab/embedded/sbin/nginx -p /var/opt/gitlab/nginx -t
#   sudo gitlab-ctl hup nginx
#
# Any request for a .yml/.yaml, a .env (incl. .env.local), or an auth.json
# ANYWHERE beneath a /files/ path is refused. 404 (not 403) so the response does
# not confirm the file exists.
location ~* /files/.*(\.ya?ml|\.env(\.[^/]*)?|/auth\.json)$ {
    deny all;
    return 404;
    access_log off;
    log_not_found off;
}
