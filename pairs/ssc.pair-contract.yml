# =============================================================================
# pairs/ssc.pair-contract.yml — REAL pair contract (ADR-0031 D2 / ops#75)
# =============================================================================
#   nwc (Drupal/Open Social, PROVIDER)  ↔  ssc (Moodle, real students, CONSUMER)
#
# The pair id is the CONSUMER site key (ssc). Consumed by lib/pair.sh
# (pair_guard) at the stg2live / stg2prod / live2prod choke-points and by
# scripts/commands/pair-smoke.sh. Committable — holds ONLY versions and public
# endpoint URLs, NO secrets.
#
# ⚠ D6 STANDING RULE (this is the REAL pair with real students): while ssc users
#   hold UID-locks against nwc's user-bearing tier, NO full-DB push to a
#   coupled tier for EITHER half — pair_guard refuses it unless --code-only.
#
# ⚠ The OAuth/OIDC WIRING these endpoints describe is F26-gated and NOT
#   implemented in Phase C — the issuer URLs below are configuration only.
#   See docs/guides/ops75-pair-contract-schema.md §OAuth (STUB).
# =============================================================================

pair: ssc-nwc                 # human label "<consumer>-<provider>"
contract_version: 1           # monotonically increasing INTEGER; bump = expand-contract change
provider: nwc                 # Drupal/Open Social — OIDC issuer, copyright source, feedback sink
consumer: ssc                 # Moodle — SSO client, copyright receiver, REAL students

# --- F28 signed-bundle linkage (ADR-0031 D5) --------------------------------
dependencies:
  provider_bundle: "nwc@0.5.0"
  consumer_bundle: "auth_nwc@1.0.0"

# --- Code surfaces: minimum counterpart versions (expand-contract; D2) -------
surfaces:
  # schema/schema_sha256 (P74 Phase 0): the wire-shape of each surface, pinned.
  # pair_guard does not yet enforce the sha (Phase 3) — inert-but-present today.
  oauth_sso:
    provider_min: "0.5.0"       # nwc simple_oauth issuer
    consumer_min: "1.0.0"       # auth_nwc Moodle plugin (F26; matches the v1.0.0 release cut on ops-auth-nwc-v1)
    schema: "contracts/oauth_sso.claims.schema.json"
    schema_sha256: "1f6add0b00f595662a13cc093ac6224e9790e6be39473de394a49540c17a6572"
  copyright_sync:
    provider_min: "0.5.0"       # nwc_copyright document versions
    consumer_min: "0.2.1"       # local_nwc_copyright_sync (ops#85 fix-forward: restores idempotency guard + beta_cc0)
    schema: "contracts/copyright_sync.record.schema.json"
    schema_sha256: "f52b4e0aa7cddc45f8f76d17ed3457681e6db2deb4e9491bca4ab0a5ff35593c"
  feedback_bridge:
    provider_min: "0.5.0"       # nwc feedback sink
    consumer_min: "0.1.0"       # local_feedback
    schema: "contracts/feedback_bridge.message.schema.json"
    schema_sha256: "83b36eec03972cef582377b9ec34e7ce5f9a7f9f35f753a32780104a776bf6c4"
  erasure:
    # ops#81 P0 — signed OP→RP right-to-be-forgotten channel (nwc→ssc). DESTRUCTIVE,
    # single-writer, idempotent. P0 = schema + contract surface only; the receiver
    # plugin (local_nwc_erase) + sender (nwc_moodle_erase) are PHASED (ops#81 P1–P5).
    provider_min: "0.6.0"       # nwc_moodle_erase (new; sibling of nwc_moodle_sync)
    consumer_min: "1.0.0"       # local_nwc_erase (new; Privacy-API delete, not soft delete)
    schema: "contracts/erasure.command.schema.json"
    schema_sha256: "db6e27c915060ef7bb559da0a9053b379c8311b15a1dc7c8598bdb523bd75f6c"

  # --- P74 Phase 1: the 3 surfaces that were LIVE but UNDECLARED --------------
  # (research report §1 — 3 of the 7 real surfaces were absent from this
  #  contract; declaring them makes the change-impact gate see the whole
  #  boundary.) These carry no new schema file yet — the point is that a diff
  #  touching them now classifies BOUNDARY-TOUCHING via the `boundary:` block.
  role_cohort_sync:
    # direction nwc→ssc, PROVIDER-WRITTEN: nwc_moodle_sync pushes guild
    # membership+roles into Moodle cohorts/roles (matched by email/username — a
    # DIFFERENT join key than the OIDC UID-lock; report §1 silent-break risk).
    provider_min: "0.5.0"       # nwc_moodle_sync
    consumer_min: "0.0.0"       # Moodle core web-services (no dedicated plugin)
  badge_read:
    # direction ssc→nwc, READ-ONLY DISPLAY: nwc_moodle_data reads Moodle badges
    # + completions (by moodle_user_id) for display on the Drupal side only.
    provider_min: "0.5.0"       # nwc_moodle_data (the nwc-side reader)
    consumer_min: "0.0.0"       # Moodle core badge/completion web-services
  shared_salt:
    # BIDIRECTIONAL DATA CONTRACT (not code-called): the deterministic-email
    # sanitizer salt must be identical on both stacks so a real email maps to
    # the SAME fake on nwc and Moodle, keeping the OIDC join alive in dev/stg.
    # Data contract lives in lib/sanitizers/oidc-email.sh (see boundary: below).
    provider_min: "0.0.0"       # lib/sanitizers/oidc-email.sh (shared tooling)
    consumer_min: "0.0.0"       # lib/sanitizers/moodle.sh consumes the same salt

# --- P74 Phase 1/2: the boundary manifest (change-impact gate source) --------
# Per-surface path/symbol map. `pl impact` (lib/boundary.sh) intersects a diff's
# changed-file list with these globs to classify it INTERNAL vs BOUNDARY-TOUCHING
# — a pure set-intersection, ONE source of truth, no hardcoding (research §3).
#
#   provider_paths / consumer_paths  repo-relative globs (`*` matches across `/`).
#                                    Moodle-plugin globs point at the SEPARATE
#                                    Moodle plugin repo (external here); they fire
#                                    when `pl impact` runs inside that repo.
#   provider_symbols                 class / service-id / function names that are
#                                    PRIVATE to the surface. The manifest-honesty
#                                    test (tests/unit/test-boundary-honesty.bats)
#                                    fails if any is referenced (non-comment) from
#                                    a file OUTSIDE this surface's declared paths.
#
# nwc profile modules live under this prefix (a SEPARATE, gitignored git repo, so
# an nwp-repo `git diff` never lists them — the classifier still fires when run in
# the profile repo, and the bats suite feeds synthetic diffs for every surface):
#   sites/nwc/dev/html/profiles/custom/nwc/modules/nwc_features/
boundary:
  oauth_sso:
    direction: "nwc->ssc"       # provider→consumer; provider-written
    provider_paths:
      - "sites/nwc/dev/html/profiles/custom/nwc/modules/nwc_features/nwc_oidc_claims/**"
      - "sites/nwc/dev/html/profiles/custom/nwc/modules/nwc_features/nwc_moodle/modules/nwc_moodle_oauth/**"
    provider_symbols:
      - NwcOidcClaimsServiceProvider
      - GuildClaimsService
    consumer_paths:
      - "moodle/auth/oauth2/**"          # EXTERNAL: auth_nwc_oauth2 Moodle plugin
  copyright_sync:
    direction: "nwc->ssc"       # single-writer (policy.writer = nwc_copyright)
    provider_paths:
      - "sites/nwc/dev/html/profiles/custom/nwc/modules/nwc_features/nwc_copyright/**"
    provider_symbols:
      - MoodleToolPolicySync
    consumer_paths:
      - "moodle/local/nwc_copyright_sync/**"   # EXTERNAL: local_nwc_copyright_sync
  feedback_bridge:
    direction: "ssc->nwc"       # consumer POSTs; nwc is the sink
    provider_paths:
      - "sites/nwc/dev/html/profiles/custom/nwc/modules/nwc_features/nwc_feedback/**"
    provider_symbols:
      - CrossSiteFeedbackController
    consumer_paths:
      - "moodle/local/feedback/**"       # EXTERNAL: local_feedback Moodle plugin
  role_cohort_sync:
    direction: "nwc->ssc"       # provider-written; matched by email/username
    provider_paths:
      - "sites/nwc/dev/html/profiles/custom/nwc/modules/nwc_features/nwc_moodle/modules/nwc_moodle_sync/**"
    provider_symbols:
      - nwc_moodle_sync_user_login
      - nwc_moodle_sync_cron
    consumer_paths:
      - "moodle/cohort/**"               # EXTERNAL: Moodle cohort/role web-services
  badge_read:
    direction: "ssc->nwc"       # nwc reads Moodle badges/completions (display)
    provider_paths:
      - "sites/nwc/dev/html/profiles/custom/nwc/modules/nwc_features/nwc_moodle/modules/nwc_moodle_data/**"
    provider_symbols:
      - nwc_moodle_data_theme
    consumer_paths:
      - "moodle/badges/**"               # EXTERNAL: Moodle badge/completion WS
  shared_salt:
    direction: "bidirectional"  # data contract: same fake email on both stacks
    provider_paths:
      - "lib/sanitizers/oidc-email.sh"   # IN-REPO: the deterministic-email tool
    provider_symbols:
      - oidc_email_sanitize
      - oidc_email_salt_load
    consumer_paths:
      - "lib/sanitizers/moodle.sh"       # IN-REPO: the Moodle-side sanitizer
  erasure:
    direction: "nwc->ssc"       # provider-driven, single-writer, DESTRUCTIVE (ops#81)
    provider_paths:
      # In-repo SOURCE of the sender module (sibling of nwc_moodle_sync)...
      - "scripts/drupal/nwc_moodle_erase/**"
      # ...and its INSTALL target inside the nwc site tree.
      - "sites/nwc/dev/html/profiles/custom/nwc/modules/nwc_features/nwc_moodle/modules/nwc_moodle_erase/**"
    provider_symbols:
      - NwcMoodleErase
    consumer_paths:
      - "moodle/local/nwc_erase/**"      # EXTERNAL: local_nwc_erase Moodle plugin

# --- Data rails (ADR-0031 D2/D6) ---------------------------------------------
identity:
  # F26 UID-lock: mdl_user.idnumber locks to the Drupal uid on first SSO.
  uid_lock: true
  # Real students → user state is canonical on live. A FULL-DB push to a tier
  # listed here is refused for EITHER half (use --code-only): on nwc it would
  # renumber Drupal uids and sever every ssc SSO identity; on ssc it would
  # clobber real students' learning records (minors' PII, plane 5b).
  coupled_tiers: [live, prod]
  # ops#83 — sub is the Drupal account UUID, NOT the serial uid. The UUID is
  # row-stored (survives a plain restore), never renumbered, never reused, so
  # the UID-lock survives an nwc renumber/rebuild/migrate (Open Social upgrade,
  # re-import). Emitted by the nwc_oidc_claims alter hook (sub=$account->uuid()).
  # LIVE-PROVEN: the switch is already deployed on the empty-seed nwc live tier.
  sub_stability: uuid
  # Enforcement for sub_stability (nwp/ops#75, pair_provider_sub_shape_guard):
  # the provider file matching sub_source must contain sub_assert, or a
  # --code-only deploy is REFUSED — this is the guard that would have caught the
  # ops#83 branch-drift (a tree emitting sub=$account->id() reaching live).
  # sub_source is a glob under the nwc provider code root; sub_assert is a
  # grep -E pattern proving the UUID sub is emitted. Active once a deploy verb
  # passes the provider code root to pair_guard (currently opt-in / inert).
  sub_source: 'html/profiles/custom/nwc/modules/nwc_features/nwc_oidc_claims/nwc_oidc_claims.module'
  sub_assert: '\$claims\["sub"\]\s*=\s*\$user->uuid\(\)'
  # ops#83 — paired-restore invariant. `sub_stability: uuid` makes the lock
  # survive a WITHIN-half renumber; `restore:` governs CROSS-half point-in-time
  # consistency (a DB restore/rebuild at a coupled tier, which D5's "rollback is
  # safe" reasoning does NOT cover — see ADR-0031 D9).
  restore:
    invariant: both-or-forward   # restore BOTH halves to one logical cut, OR move
                                 # the provider identity set only FORWARD — never
                                 # behind a consumer's newest locked identity
    ledger: provider             # append-only (uuid,uid,email,created_ts) snapshot
                                 # per nwc backup — the deterministic old-uid→uuid
                                 # repair map (never trust email; recycled-email risk)
    reconcile: from-ledger       # email fallback is a human-gated last resort only
    pre_check_required: true     # pair_guard blocks a coupled-tier restore/rebuild
                                 # lacking the consumer join-snapshot + provider ledger
                                 # (escape = ledgered --override-pair)

policy:
  # ADR-0031 D2(b) / ops#31: ONE writer, both sync paths READ. Never dual-write.
  writer: nwc_copyright
  readers: [local_nwc_copyright_sync]

render_id_stability:
  # ADR-0027 §7: rendered Moodle rows (plane 5a) are re-render-safe only because
  # the join key is id-stable; user state hangs off it.
  join_key: canonical_id
  guaranteed_by: shared-adapter-test-suite

# --- Per-environment provider endpoints (OIDC issuer per tier) ---------------
# Consumed as CONFIGURATION only; the actual client/issuer provisioning is
# F26-gated (STUB — see schema doc §OAuth).
endpoints:
  dev:
    issuer: "https://nwc-dev.ddev.site"
  stg:
    issuer: "https://nwc-stg.ddev.site"
  live:
    issuer: "https://nwc.<example-prod-domain>"
  # prod: add when the provider has a dedicated prod tier (offline-deploy-gated).

# --- F26 OIDC concrete wiring (LIVE-PROVEN 2026-07-11) -----------------------
# On 2026-07-11 the ssc↔nwc OIDC round-trip was stood up BY HAND on live and
# PROVEN end-to-end (a nwc user logged into ssc; Moodle idnumber == nwc sub — the
# UID-lock held). These are the exact facts that made it work, now codified so
# `pl moodle-promote` reproduces them (lib/moodle-promote.sh: the apply-script,
# moodle_deploy_auth_nwc; provider half: scripts/f26/nwc-provider-oidc-setup.sh).
# NO LONGER A STUB. See docs/guides/moodle-promotion-substrate.md §F26 runbook.
oidc:
  consumer_plugin: auth_nwc         # the REAL consumer (genuine UID-lock; NOT the
                                    # lock-less auth_nwc_oauth2 decoy). authtype 'nwc'.
  # Provider endpoints are set MANUALLY on the Moodle issuer — nwc exposes NO
  # discovery document (/.well-known/openid-configuration returns 404).
  discovery_available: false
  endpoints:
    authorization: "/oauth/authorize"
    token: "/oauth/token"
    userinfo: "/oauth/userinfo"      # native simple_oauth (F26 M1)
    # ⚠ GOTCHA: JWKS is at /.well-known/jwks.json — NOT /oauth/jwks, which
    #   301-redirects and silently breaks token signature verification.
    jwks: "/.well-known/jwks.json"
  issuer_name: "nwc (F26)"
  issuer_flags:
    showonloginpage: 1
    enabled: 1
    requireconfirmation: 0           # trusted issuer — no email-confirm interstitial
    loginscopes: "openid email profile"
  # User-field mappings. sub→idnumber is the UID-lock and is MANDATORY: without
  # it auth_nwc DENIES every login (B1 fail-closed edge).
  user_field_mappings:
    sub: idnumber                    # the UID-lock
    email: email
    name: firstname
    preferred_username: lastname
  auth_nwc_config:
    autoredirect: 0                  # keep the login page recoverable
    cfg_auth_appended: [oauth2, nwc] # added to $CFG->auth; core 'email' kept
  provider_prereqs:                  # nwc side — MISSING these silently breaks it
    signing_keypair: required        # drush simple-oauth:generate-keys + cset public/private
    consent_permission: "grant simple_oauth codes"   # granted to authenticated role
    consumer_confidential: true
    consumer_pkce: true              # S256
    consumer_grant_types: [authorization_code, refresh_token]
    consumer_redirect: "<consumer-wwwroot>/admin/oauth2callback.php"
  # Moodle 4.4 rejects PHP 8.4 → run admin/cli with php8.2/8.3 + max_input_vars=5000.
  cli_php_version: "8.2"
  key_rotation:
    # ops#82 — VERIFIED read-only 2026-07-11: Moodle core auth_oauth2 + auth_nwc
    # take claims from the USERINFO endpoint and do NOT verify the id_token
    # signature against JWKS (grep id_token|jwks|jwt|signature over
    # lib/classes/oauth2/ = 0 hits). So a signing-key swap does NOT break ssc SSO.
    # Trust anchors = TLS + confidential client + PKCE (S256) + bearer userinfo.
    consumer_verifies_signature: false     # <- the load-bearing fact
    jwks_uri: "https://nwc.<example-prod-domain>/.well-known/jwks.json"
    tokens_carry_kid: false                # bare RSA key: no kid/alg/use in JWKS
    provider_supports_overlap: false       # simple_oauth 6.1 = single public/private key
    mode: hard_swap                        # atomic; native overlap not available
    cadence: annual                        # or immediate on suspected key compromise
    overlap_window: 0                      # N/A while consumer_verifies_signature=false
    post_rotate_checks:
      - jwks_200_new_modulus               # /.well-known/jwks.json 200 + "n" changed
      - browser_sso_login_ssc              # real login; idnumber == sub (UID-lock holds)
      - verify_consumer_refetches: n/a     # becomes REQUIRED if consumer_verifies_signature flips true
    runbook: "docs/guides/ops82-key-rotation.md"

# --- Onboarding smoke: the 5-URL set checked after any promotion (D5) --------
# Paths are relative to that side's tier base URL. A failure sets the pair RAG
# red (which pair_guard then blocks on).
smoke_urls:
  - name: oidc_signing
    side: provider
    # LIVE-PROVEN: nwc has NO discovery doc (/.well-known/openid-configuration =
    # 404). The real signing-health probe is the JWKS at /.well-known/jwks.json
    # (200) — NOT /oauth/jwks (301). Endpoints are configured manually.
    path: "/.well-known/jwks.json"
    method: GET
    expect_status: "200"
  - name: provider_health
    side: provider
    path: "/user/login"
    method: GET
    expect_status: "200"
  - name: oauth_callback
    side: consumer
    path: "/auth/oauth2/login.php"
    method: GET
    expect_status: "200,302"
  - name: copyright_status
    side: consumer
    path: "/local/nwc_copyright_sync/status.php"
    method: GET
    expect_status: "200"
  - name: feedback_post
    side: consumer
    path: "/local/feedback/api.php"
    method: POST
    expect_status: "200,401"     # 401 acceptable without a token; token round-trip is non-prod only
