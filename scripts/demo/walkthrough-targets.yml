# =============================================================================
# scripts/demo/walkthrough-targets.yml — the demo pair's WALKTHROUGH catalogue
# =============================================================================
# ops#328 tranche 5. Read by `pl demo walkthrough <site>` (lib/demo-walkthrough.sh)
# and rendered by the console's Visuals ▸ walkthrough subtab.
#
# WHAT THIS FILE IS
# -----------------
# One row per place an operator may want to jump straight into, on either half
# of the demo pair. Each provider row names the Drupal ROUTE it stands for; each
# consumer row names a Moodle entry-point FILE. Nothing here is a guess: every
# route name below was read out of the LIVE nwd router on 2026-08-11
# (`drush route --format=json`, 1194 routes) and every consumer path was
# measured with an anonymous GET against the live ssd host the same day.
#
# WHY THE ROUTE NAME AND NOT ONLY THE PATH
# ----------------------------------------
# Because absence is not measurable over HTTP on either stack, and a link that
# looks live and lands on nothing is worse than no link:
#
#   * nwd answers an unknown path with a 55 KB THEMED 404 (measured:
#     /zzz-nonexistent-path). A 404 there tells you nothing about existence.
#   * ssd answers /auth/oauth2/login.php — a file that DOES exist, and that the
#     login page's own SSO button points at — with a Moodle-rendered 404,
#     because the probe carried no `id` and no `sesskey`. pairs/ssd.pair-
#     contract.yml records that path as one that "has never existed"; that
#     conclusion was drawn from exactly this 404 and it is wrong.
#
# So the provider half is verified through the ROUTER, which can say "no such
# route" and mean it, and can also say "that route MOVED" (state `drifted`).
# The consumer half is verified over HTTP with the only honest discriminator
# available: a 404 carrying an application-rendered body is `ambiguous`, never
# `missing`.
#
# RULES FOR EDITING
# -----------------
#   * NO HOSTNAMES, ever. Paths are site-relative and begin with "/"; the base
#     URL is resolved at run time from the site's own config (P61 leakage rule,
#     pinned by tests/unit/test-demo-walkthrough.bats).
#   * Every provider target carries `route:` OR `kind: alias`. An alias is not
#     a route (Drupal path aliases live in the alias table), so it is verified
#     over HTTP and can only ever reach `verified` or `ambiguous` — never a
#     confident `missing`. Say so rather than pretending.
#   * `{gid}` is substituted with a REAL group id read from the site; `{uid}`
#     with the walkthrough account's own uid. A target carrying an
#     unsubstituted placeholder is dropped and counted, never rendered.
#   * `admin_only: true` is a HONESTY marker for the pane, not a gate: it means
#     "a plain member does not see this", so the operator knows which part of
#     the walkthrough only the all-permissions account can reach.
# =============================================================================
