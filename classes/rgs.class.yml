# =============================================================================
# classes/rgs.class.yml — site class declaration (ADR-0036 / ops#153, ops#154)
# =============================================================================
# rgs.nwpcode.org — a live Catholic formation site (40 mini-courses, 228
# depthcontent activities) with NO SSO, NO OIDC consumer, NO auth_nwc and NO
# paired provider. It is the site that forced this axis to exist.
#
# THE PROBLEM THIS DECLARATION SOLVES
#   `pl moodle gate-status rgs` reports mod/depthcontent [UNGATED]. The gate as
#   built requires ">=1 may_keep_formation call delegating to auth_nwc". rgs has
#   nothing to delegate to, so NO artifact rgs can ever run will satisfy it, and
#   `pl moodle plugin deploy` refuses forever unless --allow-ungated is typed
#   every single time (ops#154). Two such entries are already in
#   private/moodle-gate/rgs.log. The override is honest; its PERMANENCE is the
#   bug. A gate that can only ever be overridden has stopped being a gate.
#
# WHAT THIS FILE DOES INSTEAD
#   It replaces "type --allow-ungated again" with a bounded, evidenced,
#   EXPIRING assertion that fails closed on its own terms. In particular the
#   member cap below means the exemption dissolves automatically the day rgs
#   takes a real member — which is precisely the condition ops#153 names as the
#   moment this becomes a live exposure.
# =============================================================================

site: rgs
class: member-standalone

# Why this class and not another, per classes/registry.yml decision_procedure:
#   Q1 "real non-operator accounts, or intended to hold them?" — YES. rgs is a
#      formation site built to take members; it is single-user only because it
#      has not launched, not because it never will.  => not demo, not service.
#   Q2 "paired provider supplying identity and consent?" — NO. No pair contract
#      in pairs/, no paired_with: key, no OIDC consumer, no uid_lock.
#   => member-standalone.
classified_by: "rob@carlo"
classified_at: "2026-07-28"
classified_ref: "nwp/ops#153"

art9:
  # ---------------------------------------------------------------------------
  # POSTURE: none-stored — the bounded exemption.
  #
  # The honest alternative was `local` (build a consent source into rgs). That
  # is the RIGHT long-term answer and is recorded as the required exit below,
  # but it is real Moodle work that must not be faked with a stub. Until then
  # the estate is safer with a checkable, expiring assertion than with an
  # unchecked --allow-ungated habit.
  # ---------------------------------------------------------------------------
  posture: none-stored

  evidence:
    # The probe an operator (or `pl class evidence rgs --refresh`) runs to
    # re-attest. NON-EMPTY IS MANDATORY: an unset probe_cmd is NO-PROBE and the
    # exemption fails closed, because a claim nobody can re-check is folklore.
    # Goes through the verb, per the CLAUDE.md standing order — never raw ssh.
    probe_cmd: "pl moodle cli rgs --tier=live --execute -- classes/probe-art9-rows.php"

    # The cap that makes the exemption self-dissolving. rgs today has exactly
    # one non-admin account (the sample account, last login 2026-07-08, the day
    # it was deployed). The SECOND real member makes member_count exceed this
    # and the gate goes red — by construction, not by anyone remembering.
    max_members: 1

    # How long an attestation may be trusted before it must be re-taken.
    max_age_days: 30

    # The recorded reading. Source: ops#153, verified ON THE BOX 2026-07-28 by
    # the session that filed the issue ("depthcontent_progress = 0 rows, no
    # consent/art9/nwc tables at all, 1 non-admin user, last login 2026-07-08").
    # NOT re-run by the authoring session of this file — the date is the claim,
    # and max_age_days is what stops it from being trusted forever.
    attestation:
      at: "2026-07-28"
      by: "rob@carlo"
      ref: "nwp/ops#153"
      member_count: 1
      formation_rows: 0
      consent_tables_present: false
      note: >-
        depthcontent_progress = 0 rows; no consent/art9/nwc tables exist at all;
        1 non-admin user (sample account). So nothing is being stored ungated
        right now — this exemption describes the site as it actually is.

  # The exemption is NOT open-ended. On this date it stops passing, whatever the
  # evidence says, and the required exit below has to have happened.
  expires: "2026-10-31"

  # The required exit. member-standalone permits `local` precisely so that a
  # site with no provider has a real path to a satisfiable gate rather than a
  # permanent override.
  required_exit:
    posture: local
    what: >-
      Build or port a local consent source for rgs (a Moodle-side consent
      record that mod_depthcontent's may_keep_formation can delegate to), then
      flip posture to `local` and set consent_source_plugin. At that point the
      artifact scan becomes satisfiable on rgs and the exemption is retired.
    blocked_by:
      - "ops#154 — 2 unbuilt AMD modules also block `pl moodle plugin deploy`"
      - >-
        ops#103 — rgs has no canonical buildable source in any repo with a
        remote (its build tree lives on mini:~/nwp/sites/rgs)
      - >-
        version skew: rgs runs mod_depthcontent 2026072801, ssc/ssd run
        2026072600. Moodle refuses a version downgrade, so the gated ssc copy
        cannot simply be moved onto rgs — the gate has to come FORWARD onto
        rgs's line.

# Positive assertions for the invariants this class marks NOT_APPLICABLE.
# Each is a claim that can be falsified, not a silence.
assertions:
  pair_contract_absent: true      # checked: no pairs/rgs.pair-contract.yml
  uid_lock_absent: true           # checked: no oauth2/oidc block in sites/rgs/.nwp.yml
