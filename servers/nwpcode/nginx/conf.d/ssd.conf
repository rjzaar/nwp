server {
    listen 80;
    server_name ssd.nwpcode.org;
    return 301 https://$server_name$request_uri;
}
server {
    listen 443 ssl http2;
    server_name ssd.nwpcode.org;
    ssl_certificate /etc/letsencrypt/live/ssd.nwpcode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssd.nwpcode.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ssd;
    index index.php index.html;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ [^/]\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include /opt/gitlab/embedded/conf/fastcgi_params;
    }
    location ~ /\.ht { deny all; }
}
