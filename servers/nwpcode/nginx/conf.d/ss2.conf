# ss2.nwpcode.org RETIRED 2026-07-21 — the v1 archive is superseded by v3 on
# ss.nwpcode.org (Curated tab = ss2's view; all v1 courses are in v3). Docroot
# /var/www/ss2 preserved + backed up (~/ss2-archive-*, ~/ss2-docroot-*). To
# restore: put back ~/ss2.conf-*.bak and reload.
server {
    listen 80;
    server_name ss2.nwpcode.org;
    return 301 https://ss.nwpcode.org$request_uri;
}
server {
    listen 443 ssl http2;
    server_name ss2.nwpcode.org;
    ssl_certificate /etc/letsencrypt/live/ss2.nwpcode.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ss2.nwpcode.org/privkey.pem;
    return 301 https://ss.nwpcode.org$request_uri;
}
