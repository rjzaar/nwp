# SYNTHETIC fixture — invented prose, no corpus content. See ../../README.md.
#
# ONE learning point per defect class, with the other fields deliberately kept
# valid, so a check that stops detecting its class fails exactly one assertion
# and the failure names the class.
#
# Fixture facts the assertions depend on:
